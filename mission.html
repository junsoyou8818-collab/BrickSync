<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- 최상위 윈도우 자동 래핑 리다이렉트 스크립트 -->
    <script>
        if (window === window.parent) {
            let currentPage = window.location.pathname.split('/').pop() + window.location.search;
            if (!currentPage || currentPage.startsWith('?')) {
                currentPage = 'index.html' + window.location.search;
            }
            sessionStorage.setItem('brickSyncLastPage', currentPage);
            window.location.href = 'app.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 미션</title>
    <!-- 폰트 적용 -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f1e73 0%, #6c1f86 50%, #eab308 100%);
            overflow: hidden;
            color: #1e293b;
        }

        .mission-container {
            width: 80%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            padding: 60px;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mission-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.05);
            padding-bottom: 20px;
        }

        .mission-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #6c1f86;
        }

        .mission-badge {
            background: #facc15;
            color: #1e293b;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(250, 204, 21, 0.3);
            /* STAGE 1 항상 1줄 유지 */
            white-space: nowrap;
        }

        .mission-content {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #475569;
            margin-bottom: 50px;
        }

        .mission-goals {
            background: #f8fafc;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 40px;
            border: 1px solid #e2e8f0;
        }

        .mission-goals h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mission-goals ul {
            list-style: none;
        }

        .mission-goals li {
            position: relative;
            padding-left: 30px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .mission-goals li::before {
            content: '✔';
            position: absolute;
            left: 0;
            top: 2px;
            color: #22c55e;
            font-weight: 900;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
        }

        .btn-back {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-back:hover {
            background: #cbd5e1;
            transform: translateY(-2px);
        }

        .btn-start {
            background: #eab308;
            color: #1e293b;
            box-shadow: 0 10px 20px rgba(234, 179, 8, 0.3);
        }

        .btn-start:hover {
            background: #facc15;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(234, 179, 8, 0.4);
        }
    </style>
<script>
    (function() {
        try {
            const u = new URLSearchParams(window.location.search).get('unit') || localStorage.getItem('brickSyncLastUnit');
            if (u) {
                const isAi = String(u) >= '6';
                const type = isAi ? 'ai' : 'lesson';
                let recent = JSON.parse(localStorage.getItem('bricksync_recent_units') || '[]');
                recent = recent.filter(item => !(String(item.unit) === String(u) && item.type === type));
                recent.push({ unit: String(u), type: type, time: Date.now() });
                if (recent.length > 3) {
                    recent = recent.slice(-3);
                }
                localStorage.setItem('bricksync_recent_units', JSON.stringify(recent));
            }
        } catch(e) {}
    })();
</script>
</head>

<body>

    <div class="mission-container">
        <div class="mission-header">
            <h1 class="mission-title" id="m-title">학습 미션 브리핑</h1>
            <div class="mission-badge" id="m-badge">STAGE 1</div>
        </div>

        <div class="mission-content" id="m-desc">
            레고 스파이크 에센셜 허브를 사용하여 새로운 코딩 모험을 시작할 준비가 되셨나요? <br>
            이번 학습에서는 포트나이트 캣 아일랜드와 현실의 레고 조명을 연동하는 방법을 배웁니다.
        </div>

        <div class="mission-goals">
            <h3><i data-lucide="target" style="color:#eab308;"></i>이번 미션의 목표</h3>
            <ul id="m-goals">
                <li>레고 스파이크 허브에 블루투스로 연결하기</li>
                <li>무한 루프와 조명 블록을 사용해 깜빡이는 신호 장치 코딩하기</li>
                <li>코드를 실행하여 섬에 있는 고양이에게 신호 보내기</li>
            </ul>
        </div>

        <div class="btn-group">
            <a href="#" onclick="if (window.parent && window.parent.navigateIframe) { window.parent.navigateIframe('index.html'); } else { window.location.href='index.html?v='+new Date().getTime(); } return false;"
                class="btn btn-back">
                <i data-lucide="arrow-left"></i> 뒤로가기
            </a>
            <a href="lesson.html" class="btn btn-start" id="m-start-btn">
                미션 코딩 시작 <i data-lucide="play"></i>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // URL에서 파라미터(unit) 읽어와서 동적으로 텍스트 변경
        const urlParams = new URLSearchParams(window.location.search);
        const unit = urlParams.get('unit') || '1';

        const missionData = {
            ko: {
                '1': {
                    title: '학습 1: 탐험보트를 출발시켜요',

                    goals: ['블루투스 혹은 USB로 스파이크 허브 연결하기', '대기 블록과 이동 블록 연결하기', '포트나이트 게임에 신호 보내기']
                },
                '2': {

                    goals: ['모터 회전 블록 사용법 이해하기', '모터 속도를 디테일하게 제어하기', '장애물 돌파를 위한 코드 작성']

                    goals: ['모터 시계방향 및 반시계방향 블록 사용법 익히기', '시계방향 3번, 반시계방향 2번으로 대관람차 가동 완료하기']

                    goals: ['재생(시작) 블록 연결하기', '전진 블록을 활용하여 앞으로 4번 이동하기', '우회전(오른쪽 회전) 블록을 사용해 방향 전환하기', '다시 전진 블록으로 앞으로 2번 더 이동하여 목적지 도착하기']
                },
                '5': {
                    title: '학습 5: 사이렌을 켜줘',
                    badge: 'STAGE 5',
                    desc: '조명 블록과 대기 블록을 조합하여, 동굴 속에서 일정 시간 동안 불이 켜졌다가 자동으로 꺼지는 동굴 탐사선 전조등 제어 코드를 만들어 봅니다.',
                    goals: ['재생(시작) 블록 연결하기', '조명(라이트) 블록을 꺼내어 연결하기', '대기 블록을 연결하여 전조등이 켜져 있는 시간 조절하기', '코드 실행 완료 후 포트나이트 게임 내에서 황금 동전 수집하기']
                },
                '6': {
                    title: 'AI 6: 가위, 바위, 보로 여닫는 오두막 지붕',
                    badge: 'STAGE 6',
                    desc: '카메라에 가위, 바위, 보 제스처를 취해 오두막 지붕을 여닫고 포트나이트 장치와 연동해 봅니다.',
                    goals: ['웹캠 권한 허용 및 AI 제스처 인식 활성화하기', '가위, 바위, 보 제스처 이벤트 블록 연결하기', '모터 회전 및 5초 대기 블록 연결하여 지붕 제어하기']

                    badge: 'STAGE 7',
                    desc: '마이크에 "앞으로 두 바퀴"를 말해 요술 그네 모터를 2회 회전시킵니다.',
                    goals: ['마이크 연결 및 음성 인식 활성화하기', 'AI 음성 인식 블록 연결하기', '5초 대기하기 및 모터를 반시계 방향으로 2회 회전하기']
                },
                '8': {
                    title: 'AI 8: 몬스터를 보여줘! 경보 알림켜기',
                    badge: 'STAGE 8',
                    desc: '웹캠에 몬스터 블록이 감지될 때와 감지되지 않을 때의 상태를 학습시켜, 몬스터가 비춰지면 연결된 블록들의 기능을 실행시킵니다.',
                    goals: ['웹캠 및 AI 이미지 비전 엔진 연결하기', '몬스터 블록 감지 데이터 학습시키기', '몬스터 감지 시 경보 알림 및 모터 기능 구동하기']
                }
            },
            en: {
                '1': {
                    title: 'Lesson 1: Launch the exploration boat',
                    badge: 'STAGE 1',
                    desc: 'Wait 5 seconds, move forward 3 times, turn left once, and move backward 2 times.',
                    goals: ['Connect Spike Hub via Bluetooth or USB', 'Connect wait and movement blocks', 'Send signals to Fortnite game']
                },
                '2': {
                    title: 'Lesson 2: Explore the sea with an underwater submarine',
                    badge: 'STAGE 2',

                },

                    title: 'Lesson 4: Ride a Cave Car and Travel',

                    desc: 'Wait 5 seconds, move forward 4 times, turn right once, and move forward 2 times.',
                    goals: ['Connect play (start) block', 'Move forward 4 times using motor blocks', 'Use right turn block to change direction', 'Move forward 2 more times to reach the destination']
                },
                '5': {
                    title: 'Lesson 5: Turn on the siren',
                    badge: 'STAGE 5',
                    desc: 'Make the red light turn on after waiting 2 seconds.',
                    goals: ['Connect play (start) block', 'Connect color light matrix block', 'Connect wait block to adjust lighting duration', 'Collect golden coins inside Fortnite once execution completes']
                },
                '6': {
                    title: 'AI Lesson 6: RPS Gesture-Controlled Cabin Roof (Open/Close)',
                    badge: 'STAGE 6',
                    desc: 'Use Rock-Paper-Scissors hand gestures via webcam to open and close the cabin roof and sync with Fortnite.',
                    goals: ['Allow webcam access and activate AI gesture recognition', 'Connect Rock-Paper-Scissors gesture event blocks', 'Connect motor rotation and 5-second wait blocks to control the roof']
                },
                '7': {
                    title: 'AI Lesson 7: Shout into the Mic! Control the Magic Swing with Your Voice',
                    badge: 'STAGE 7',
                    desc: 'Say "Turn Forward Twice" into the microphone to rotate the magic swing motor twice.',
                    goals: ['Connect microphone and activate voice recognition', 'Connect AI Voice Recognition block', 'Wait 5 seconds and rotate the motor counterclockwise twice']
                },
                '8': {
                    title: 'AI Lesson 8: Animal Alert Ranger (Monster Camera)',
                    badge: 'STAGE 8',
                    desc: 'Train webcam states for monster block detection, and trigger connected block actions when a monster is detected.',
                    goals: ['Connect webcam and AI image vision engine', 'Train monster block detection dataset', 'Trigger alarm alert and motor actions upon monster detection']
                }
            }
        };

        function renderBriefing() {
            const lang = localStorage.getItem('bricksync_lang') || 'ko';
            const current = (missionData[lang] || missionData['ko'])[unit];
            
            if (current) {
                document.getElementById('m-title').textContent = current.title;
                document.getElementById('m-badge').textContent = current.badge;
                document.getElementById('m-desc').textContent = current.desc;

                const goalsEl = document.getElementById('m-goals');
                goalsEl.innerHTML = '';
                current.goals.forEach(g => {
                    const li = document.createElement('li');
                    li.textContent = g;
                    goalsEl.appendChild(li);
                });

                // 미션 시작 버튼의 href에 파라미터 전달
                const isAiUnit = String(unit) >= '6';
                document.getElementById('m-start-btn').href = isAiUnit ? `ai_fusion.html?unit=${unit}` : `lesson.html?unit=${unit}`;
            }

            // Static UI elements translations
            if (lang === 'en') {
                document.title = "Learning Mission";
                const goalsHeader = document.querySelector('.mission-goals h3');
                if (goalsHeader) {
                    goalsHeader.innerHTML = '<i data-lucide="target" style="color:#eab308;"></i>Mission Objectives';
                }
                const backBtn = document.querySelector('.btn-back');
                if (backBtn) {
                    backBtn.innerHTML = '<i data-lucide="arrow-left"></i> Go Back';
                }
                const startBtn = document.getElementById('m-start-btn');
                if (startBtn) {
                    startBtn.innerHTML = 'Start Mission Coding <i data-lucide="play"></i>';
                }
            } else {
                document.title = "학습 미션";
                const goalsHeader = document.querySelector('.mission-goals h3');
                if (goalsHeader) {
                    goalsHeader.innerHTML = '<i data-lucide="target" style="color:#eab308;"></i>이번 미션의 목표';
                }
                const backBtn = document.querySelector('.btn-back');
                if (backBtn) {
                    backBtn.innerHTML = '<i data-lucide="arrow-left"></i> 뒤로가기';
                }
                const startBtn = document.getElementById('m-start-btn');
                if (startBtn) {
                    startBtn.innerHTML = '미션 코딩 시작 <i data-lucide="play"></i>';
                }
            }
            lucide.createIcons();
        }

        // Run rendering on load
        renderBriefing();

        window.addEventListener('bricksync-language-changed', (e) => {
            renderBriefing();
        });
    </script>
</body>

</html>
