<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BrickSync</title>
    <!-- 폰트 적용 -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Firebase SDK 및 공통 설정 연동 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- firebase-auth-compat disabled for Firestore Cloud Auth Engine -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase_config.js"></script>
    <script>
        // 학생 세션 체크: Firebase Auth 우선, localStorage 레거시 폴백
        (function () {
            function checkLegacySession() {
                try {
                    const sessionDataStr = localStorage.getItem('bricksync_student_session');
                    if (!sessionDataStr) return false;
                    const sessionData = JSON.parse(sessionDataStr);
                    if (Date.now() >= sessionData.expires) {
                        localStorage.removeItem('bricksync_student_session');
                        return false;
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            // Firebase Auth 상태 확인 (비동기)
            if (typeof firebaseAuth !== 'undefined' && firebaseAuth) {
                // Firebase Auth 초기화 시간 및 레거시 세션 없으면 리다이렉트
                let authResolved = false;
                const authTimeout = setTimeout(() => {
                    if (!authResolved) {
                        if (!checkLegacySession()) {
                            window.location.href = 'login.html';
                        }
                    }
                }, 3000);

                firebaseAuth.onAuthStateChanged((user) => {
                    authResolved = true;
                    clearTimeout(authTimeout);
                    if (!user && !checkLegacySession()) {
                        window.location.href = 'login.html';
                    }
                });
            } else {
                if (!checkLegacySession()) {
                    window.location.href = 'login.html';
                    return;
                }
            }

            // LocalStorage 이벤트 감지 (타 탭 로그아웃)
            window.addEventListener('storage', (e) => {
                if (e.key === 'bricksync_student_session' && !e.newValue) {
                    if (typeof firebaseAuth === 'undefined' || !firebaseAuth?.currentUser) {
                        window.location.href = 'login.html';
                    }
                }
            });

            // BroadcastChannel 수신 감지
            try {
                const monitorChannel = new BroadcastChannel('bricksync_monitor');
                monitorChannel.onmessage = function (event) {
                    if (event.data && event.data.type === 'RESET_ALL') {
                        localStorage.removeItem('bricksync_student_session');
                        window.location.href = 'login.html';
                    }
                };
            } catch (e) { }

            // Firebase Realtime DB 리셋 신호 감지
            if (typeof isFirebaseOnline !== 'undefined' && isFirebaseOnline && database) {
                try {
                    database.ref('bricksync_classroom/reset_signal').on('value', (snapshot) => {
                        const resetTime = snapshot.val();
                        if (resetTime) {
                            const sessionDataStr = localStorage.getItem('bricksync_student_session');
                            if (sessionDataStr) {
                                const session = JSON.parse(sessionDataStr);
                                const loginTime = session.loginTime || 0;
                                if (resetTime > loginTime) {
                                    localStorage.removeItem('bricksync_student_session');
                                    window.location.href = 'login.html';
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.error("Firebase reset monitor setup failed:", e);
                }
            }
        })();
    </script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0f172a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <!-- 모든 페이지는 이 iframe 안에서 전환되며, 블루투스는 부모 창인 여기서 영구 유지됩니다. -->
    <iframe id="main-frame"
        allow="camera *; microphone *; bluetooth *; autoplay *; window-placement; camera; microphone; bluetooth; midi; usb; display-capture"></iframe>

    <!-- ═══════════════════════════════════════════════════════════
         Electron 전용 Bluetooth 장치 선택 UI (Chrome picker 대체)
         main.js에서 IPC로 bluetooth-devices 이벤트 수신 시 표시
         ═══════════════════════════════════════════════════════════ -->
    <div id="bt-picker-backdrop" style="
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 99998;
    "></div>

    <div id="bt-picker" style="
        display: none;
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.28);
        width: 360px;
        font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
        z-index: 99999;
        overflow: hidden;
    ">
        <!-- 헤더 -->
        <div style="padding: 20px 24px 12px; border-bottom: 1px solid #e8eaed;">
            <div style="font-size: 13px; color: #5f6368; margin-bottom: 6px;">www.bricksync.org과(와) 연결을 시도 합니다.</div>
        </div>

        <!-- 장치 목록 -->
        <div id="bt-device-list" style="
            min-height: 80px;
            max-height: 220px;
            overflow-y: auto;
            padding: 8px 0;
        ">
            <!-- 스캔 중 상태 -->
            <div id="bt-scanning" style="
                display: flex; align-items: center; gap: 12px;
                padding: 16px 24px;
                color: #5f6368; font-size: 13px;
            ">
                <svg width="16" height="16" viewBox="0 0 24 24" style="animation: bt-spin 1s linear infinite; flex-shrink:0;">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="#4285f4" stroke-width="3" stroke-dasharray="40" stroke-dashoffset="10"/>
                </svg>
                스캔하는 중...
            </div>
        </div>

        <!-- 하단 버튼 -->
        <div style="
            display: flex; justify-content: flex-end; gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #e8eaed;
        ">
            <button id="bt-cancel-btn" style="
                padding: 8px 20px; border: none; border-radius: 6px;
                background: transparent; color: #1a73e8;
                font-size: 14px; font-weight: 500; cursor: pointer;
            " onmouseover="this.style.background='#f1f3f4'" onmouseout="this.style.background='transparent'">
                취소
            </button>
            <button id="bt-connect-btn" style="
                padding: 8px 20px; border: none; border-radius: 6px;
                background: #1a73e8; color: #fff;
                font-size: 14px; font-weight: 500; cursor: pointer;
                opacity: 0.4; pointer-events: none;
            ">
                연결
            </button>
        </div>
    </div>

    <style>
        @keyframes bt-spin {
            to { transform: rotate(360deg); }
        }
        .bt-device-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 24px; cursor: pointer;
            font-size: 14px; color: #202124;
            transition: background 0.15s;
        }
        .bt-device-item:hover { background: #f1f3f4; }
        .bt-device-item.selected { background: #e8f0fe; color: #1a73e8; }
        .bt-device-icon { font-size: 18px; flex-shrink: 0; }
    </style>

    <script>
        // ── Bluetooth Picker UI 로직 ──
        (function () {
            const picker     = document.getElementById('bt-picker');
            const backdrop   = document.getElementById('bt-picker-backdrop');
            const deviceList = document.getElementById('bt-device-list');
            const scanning   = document.getElementById('bt-scanning');
            const connectBtn = document.getElementById('bt-connect-btn');
            const cancelBtn  = document.getElementById('bt-cancel-btn');
            let selectedDeviceId = null;

            function showPicker() {
                picker.style.display = 'block';
                backdrop.style.display = 'block';
                // 스캔 중 초기화
                scanning.style.display = 'flex';
                // 기존 장치 항목 제거 (스캔 div 제외)
                Array.from(deviceList.querySelectorAll('.bt-device-item')).forEach(el => el.remove());
                selectedDeviceId = null;
                connectBtn.style.opacity = '0.4';
                connectBtn.style.pointerEvents = 'none';
            }

            function hidePicker() {
                picker.style.display = 'none';
                backdrop.style.display = 'none';
            }

            function selectDevice(id) {
                selectedDeviceId = id;
                connectBtn.style.opacity = '1';
                connectBtn.style.pointerEvents = 'auto';
            }

            // Electron IPC: main에서 장치 목록 수신
            if (window.electronAPI) {
                window.electronAPI.onBluetoothDevices(function (devices) {
                    showPicker();

                    if (!devices || devices.length === 0) {
                        // 아직 스캔 중
                        scanning.style.display = 'flex';
                        return;
                    }

                    // 스캔 완료 → 장치 목록 표시
                    scanning.style.display = 'none';

                    // 기존 항목 제거
                    Array.from(deviceList.querySelectorAll('.bt-device-item')).forEach(el => el.remove());

                    devices.forEach(function (device) {
                        const item = document.createElement('div');
                        item.className = 'bt-device-item';
                        item.dataset.deviceId = device.id;

                        const icon = document.createElement('span');
                        icon.className = 'bt-device-icon';
                        icon.textContent = device.isLego ? '🎮' : '📶';

                        const name = document.createElement('span');
                        name.textContent = device.name;

                        item.appendChild(icon);
                        item.appendChild(name);

                        item.addEventListener('click', function () {
                            Array.from(deviceList.querySelectorAll('.bt-device-item'))
                                .forEach(function (el) { el.classList.remove('selected'); });
                            item.classList.add('selected');
                            selectDevice(device.id);
                        });

                        deviceList.appendChild(item);

                        // LEGO Hub가 하나뿐이면 자동 선택
                        if (device.isLego && devices.filter(function(d){ return d.isLego; }).length === 1) {
                            item.classList.add('selected');
                            selectDevice(device.id);
                        }
                    });
                });
            }

            // 연결 버튼
            connectBtn.addEventListener('click', function () {
                if (selectedDeviceId && window.electronAPI) {
                    // 연결 중 UI 표시 (흰 화면 대신 로딩 표시)
                    connectBtn.textContent = '연결 중...';
                    connectBtn.style.opacity = '0.7';
                    connectBtn.style.pointerEvents = 'none';
                    cancelBtn.style.pointerEvents = 'none';

                    window.electronAPI.selectBluetoothDevice(selectedDeviceId);

                    // GATT 연결 완료 or 실패 시 picker 닫기 (connectionType 변화 감지)
                    const checkInterval = setInterval(function () {
                        if (window.connectionType === 'BLE') {
                            clearInterval(checkInterval);
                            hidePicker();
                        }
                    }, 300);

                    // 15초 타임아웃 후 자동 닫기 (GATT 10초 타임아웃보다 길어야 에러 알림 표시됨)
                    setTimeout(function () {
                        clearInterval(checkInterval);
                        hidePicker();
                    }, 15000);
                }
            });


            // 취소 버튼
            cancelBtn.addEventListener('click', function () {
                if (window.electronAPI) {
                    window.electronAPI.selectBluetoothDevice('');
                }
                hidePicker();
            });

            // 배경 클릭 취소
            backdrop.addEventListener('click', function () {
                if (window.electronAPI) {
                    window.electronAPI.selectBluetoothDevice('');
                }
                hidePicker();
            });
        })();
    </script>

    <script>
        // SPA 내부 페이지 상태 유지 (새로고침 시 마지막 화면 복원)
        (function () {
            let lastPage = sessionStorage.getItem('brickSyncLastPage') || 'login.html';
            // 쿼리 파라미터가 이미 있는지 확인하여 캐시 무력화 구문 추가
            const sep = lastPage.includes('?') ? '&' : '?';
            document.getElementById('main-frame').src = lastPage + sep + 'v=' + new Date().getTime();
        })();

        // [신규] iframe 내부 페이지 안전 이동 함수 (크롬 정책 보호)
        window.navigateIframe = function(url) {
            console.log("▶ [PARENT_NAV] navigateIframe called with url:", url);
            try {
                const sep = url.includes('?') ? '&' : '?';
                const iframe = document.getElementById('main-frame');
                console.log("▶ [PARENT_NAV] iframe element found:", iframe);
                if (iframe) {
                    const targetSrc = url + sep + 'v=' + new Date().getTime();
                    console.log("▶ [PARENT_NAV] Setting iframe src to:", targetSrc);
                    iframe.src = targetSrc;
                } else {
                    console.error("▶ [PARENT_NAV] Error: iframe element not found!");
                }
            } catch (e) {
                console.error("▶ [PARENT_NAV] Iframe navigation failed:", e);
            }
        };
    </script>

    <script>
        // === [글로벌 SPA 상태 및 코어 통신 엔진] ===
        window.connectionType = null;
        window.rxCharacteristic = null;
        window.txCharacteristic = null;
        window.port = null;
        window.writer = null;
        window.activeStates = { LEFT: false, RIGHT: false, UP: false, DOWN: false };
        window.initialX = null;
        window.initialY = null;
        window.candidateXState = "CENTER_X";
        window.candidateYState = "CENTER_Y";
        window.consecutiveXFrames = 0;
        window.consecutiveYFrames = 0;
        window.lastStableXState = "CENTER_X";
        window.lastStableYState = "CENTER_Y";

        let ws;

        // --- 1. 파이썬 로컬 서버 통신 (자동 재연결 적용) ---
        function connectWebSocket() {
            let wsUrl = "ws://127.0.0.1:8000/ws";
            // 로컬 환경(localhost/127.0.0.1)에서 직접 접속한 경우 현재 호스트 사용
            if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                let protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
                wsUrl = protocol + window.location.host + "/ws";
            }
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                console.log("✔️ 백그라운드 키보드 서버 접속 성공!");
                updateWsUI(true);
            };
            ws.onerror = () => { };
            ws.onclose = () => {
                updateWsUI(false);
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updateWsUI(isConnected) {
            const iframe = document.getElementById("main-frame").contentWindow;
            if (iframe && iframe.document.getElementById('status')) {
                const statusEl = iframe.document.getElementById('status');
                if (isConnected) {
                    statusEl.innerHTML = "<b>🟢 로컬 서버(포트나이트 연동) 연결 완료</b>";
                    statusEl.style.color = "#10b981";
                } else {
                    statusEl.innerHTML = "<b>🔴 로컬 브릿지 서버(server.py) 연결 안 됨</b>";
                    statusEl.style.color = "#ef4444";
                }
            }
        }

        connectWebSocket();

        // iframe 내에서 웹소켓에 직접 접근할 수 있도록 노출
        window.sendWebSocketAction = function (actionObj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(actionObj));
            }
        };

        function sendCommand(actionName) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: actionName }));
            }
        }

        // UI 상태 업데이트를 Iframe 내부 요소로 전달
        function updateUI(status) {
            const iframe = document.getElementById("main-frame").contentWindow;
            if (!iframe) return;

            const currentLang = localStorage.getItem('bricksync_lang') || 'ko';

            // lesson.html 용 UI 업데이트
            if (iframe.document.getElementById('hubStatusText')) {
                const dot = iframe.document.getElementById('hubStatusDot');
                const txt = iframe.document.getElementById('hubStatusText');
                if (status === 'BLE') {
                    if (dot) {
                        dot.style.background = '#3b82f6';
                        dot.style.boxShadow = '0 0 8px rgba(59, 130, 246, 0.4)';
                    }
                    txt.innerText = currentLang === 'en' ? 'Bluetooth Connected' : '블루투스 연결됨';
                    txt.style.color = '#3b82f6';
                } else if (status === 'USB') {
                    if (dot) {
                        dot.style.background = '#10b981';
                        dot.style.boxShadow = '0 0 8px rgba(16, 185, 129, 0.4)';
                    }
                    txt.innerText = currentLang === 'en' ? 'USB Connected' : 'USB 연결됨';
                    txt.style.color = '#10b981';
                } else if (status === 'DISCONNECT') {
                    if (dot) {
                        dot.style.background = '#e5e7eb';
                        dot.style.boxShadow = 'none';
                    }
                    txt.innerText = currentLang === 'en' ? 'Disconnected' : '연결 끊김';
                    txt.style.color = '#6b7280';
                }
            }

            // index.html 용 UI 업데이트
            if (iframe.document.getElementById('status')) {
                const statusEl = iframe.document.getElementById('status');
                if (status === 'BLE') {
                    statusEl.innerText = currentLang === 'en' ? 'Bluetooth Connected' : '블루투스 연결됨';
                    statusEl.style.color = '#3b82f6';
                } else if (status === 'USB') {
                    statusEl.innerText = currentLang === 'en' ? 'USB Connected' : 'USB 연결됨';
                    statusEl.style.color = '#10b981';
                } else if (status === 'DISCONNECT') {
                    statusEl.innerText = currentLang === 'en' ? 'Disconnected' : '연결 끊김';
                    statusEl.style.color = '#6b7280';
                }
            }
        }

        window.addEventListener('bricksync-language-changed', (e) => {
            if (window.connectionType !== undefined && window.connectionType !== null) {
                updateUI(window.connectionType);
            }
        });


        let bleWriteQueue = Promise.resolve();

        // --- 2. Web Bluetooth 및 USB 통신 영역 ---
        window.writeToHub = async function (data) {
            try {
                if (typeof data !== 'string') {
                    console.log("⚡ [LEGO HUB PACKET]", data);
                }
            } catch(e) {}
            let buffer = (typeof data === 'string') ? new TextEncoder().encode(data) : data;

            if (window.connectionType === 'USB') {
                if (!window.writer) window.writer = window.port.writable.getWriter();
                await window.writer.write(buffer);
                window.writer.releaseLock();
                window.writer = null;
            } else if (window.connectionType === 'BLE' || window.txCharacteristic) {
                // Queue the BLE write to prevent GATT conflicts
                bleWriteQueue = bleWriteQueue.then(async () => {
                    for (let i = 0; i < buffer.byteLength; i += 20) {
                        let chunk = buffer.slice(i, i + 20);
                        if (window.txCharacteristic) {
                            let retries = 3;
                            while (retries > 0) {
                                try {
                                    if (window.txCharacteristic.writeValueWithoutResponse) {
                                        await window.txCharacteristic.writeValueWithoutResponse(chunk);
                                    } else {
                                        await window.txCharacteristic.writeValue(chunk);
                                    }
                                    break;
                                } catch (e) {
                                    try {
                                        await window.txCharacteristic.writeValue(chunk);
                                        break;
                                    } catch (e2) {
                                        console.log("BLE Write Error (retrying)", e2);
                                        retries--;
                                        await new Promise(r => setTimeout(r, 30));
                                    }
                                }
                            }
                            // 시스템 BLE 큐 확보를 위해 청크 당 대기
                            await new Promise(r => setTimeout(r, 20));
                        }
                    }
                });
                await bleWriteQueue;
            }
        };

        window.connectUSB = async function () {
            try {
                window.port = await navigator.serial.requestPort();
                await window.port.open({ baudRate: 115200 });
                window.connectionType = 'USB';
                updateUI('USB');

                try {
                    const monitorChannel = new BroadcastChannel('bricksync_monitor');
                    let studentName = 'Guest_익명';
                    const sessionDataStr = localStorage.getItem('bricksync_student_session');
                    if (sessionDataStr) {
                        const sessionData = JSON.parse(sessionDataStr);
                        if (Date.now() < sessionData.expires) studentName = sessionData.name;
                    }
                    monitorChannel.postMessage({
                        type: 'SYSTEM',
                        msg: `레고 스파이크 허브 USB 연결 성공 🟢`,
                        student: studentName
                    });
                } catch (e) { }

                await window.writeToHub('\x03\x03');
                readLoopUSB();
            } catch (error) {
                console.error("USB 연결 오류:", error);
                if (error.name !== 'NotFoundError' && error.name !== 'AbortError') {
                    alert("❌ USB 연결 실패: " + error.message + "\n\n(가능한 원인: 다른 크롬 창, 레고 스파이크 공식 앱, 또는 브릭싱크 백그라운드 프로그램이 이미 장치를 점유하고 있을 수 있습니다.)");
                }
            }
        };

        window.connectBluetooth = async function () {
            // ── navigator.bluetooth 가용성 확인 ──
            if (!navigator.bluetooth) {
                // Chrome / Edge 권한 차단 vs 미지원 구분
                const isChromium = /chrome/i.test(navigator.userAgent) || /edg/i.test(navigator.userAgent);
                if (isChromium) {
                    alert(
                        '🔒 브라우저가 Bluetooth 접근을 차단하고 있습니다.\n\n' +
                        '해결 방법:\n' +
                        '① 주소창 왼쪽 자물쇠(🔒) 클릭\n' +
                        '② "Bluetooth" → "허용" 으로 변경\n' +
                        '③ 페이지 새로고침(F5)\n\n' +
                        '또는 브라우저 주소창에 아래를 입력하세요:\n' +
                        'chrome://settings/content/bluetoothDevices\n' +
                        '(Edge는 edge://settings/content/bluetoothDevices)'
                    );
                } else {
                    alert(
                        '❌ 블루투스를 사용할 수 없습니다.\n\n' +
                        '• Chrome 또는 Edge 브라우저를 사용해 주세요 (Firefox · Safari 미지원)\n' +
                        '• Windows Bluetooth가 켜져 있는지 확인하세요\n' +
                        '• [설정 → Bluetooth 및 장치]에서 Bluetooth를 켜주세요.'
                    );
                }
                window.connectionType = null;
                return false;
            }

            const LEGO_HUB_SERVICE_ID = '00001623-1212-efde-1623-785feabcd123';
            const OPTIONAL_SERVICE_ID  = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';

            // ── Electron 환경 감지 ──
            const isElectron = /electron/i.test(navigator.userAgent);

            const requestOptions = isElectron
                ? {
                    // Electron: 이름 접두사 필터
                    filters: [
                        { namePrefix: 'LEGO' },
                        { namePrefix: 'Hub' },
                        { namePrefix: 'SPIKE' },
                        { namePrefix: 'Technic' }
                    ],
                    optionalServices: [LEGO_HUB_SERVICE_ID, OPTIONAL_SERVICE_ID]
                  }
                : {
                    // 일반 브라우저: 서비스 UUID + 이름 접두사 동시 필터 (어느 쪽이든 매칭)
                    filters: [
                        { services: [LEGO_HUB_SERVICE_ID] },
                        { namePrefix: 'LEGO' },
                        { namePrefix: 'Hub' },
                        { namePrefix: 'SPIKE' },
                        { namePrefix: 'Technic' }
                    ],
                    optionalServices: [LEGO_HUB_SERVICE_ID, OPTIONAL_SERVICE_ID]
                  };

            try {
                const device = await navigator.bluetooth.requestDevice(requestOptions);
                await connectBluetoothDevice(device);
                return true;
            } catch (error) {
                if (error.name === 'NotFoundError') {
                    alert('🔍 LEGO Hub를 찾을 수 없습니다.\n\n• Hub 전원이 켜져 있는지 확인하세요\n• Hub의 버튼을 한 번 눌러 검색 모드로 설정하세요\n• Hub가 다른 기기와 연결되어 있으면 먼저 끊어주세요');
                } else if (error.name === 'NetworkError') {
                    alert('📡 블루투스 접속 오류\n기기가 꺼져있거나 다른 장치와 연결되어 있습니다.');
                } else if (error.name === 'SecurityError') {
                    alert('🔒 블루투스 권한이 없습니다.\n앱을 다시 시작하거나 관리자에게 문의하세요.');
                } else if (error.name !== 'NotAllowedError') {
                    alert(`⚠️ 블루투스 오류\n오류 유형: ${error.name}\n${error.message}`);
                    console.error('Bluetooth 오류:', error);
                }
                window.connectionType = null;
                throw error;
            }
        };

        async function connectBluetoothDevice(device) {
            const LEGO_HUB_SERVICE_ID = '00001623-1212-efde-1623-785feabcd123';
            const LEGO_HUB_CHARACTERISTIC_ID = '00001624-1212-efde-1623-785feabcd123';
            const NORDIC_UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
            const NORDIC_UART_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
            const NORDIC_UART_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

            if (!device.hasDisconnectListener) {
                device.addEventListener('gattserverdisconnected', () => {
                    window.connectionType = null;
                    updateUI('DISCONNECT');
                    setTimeout(() => startBackgroundReconnect(device), 3000);
                });
                device.hasDisconnectListener = true;
            }

            // [1단계] GATT 서버 연결 (10초 타임아웃)
            let server;
            try {
                server = await Promise.race([
                    device.gatt.connect(),
                    new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('GATT 연결 시간 초과 (10초)\n\n• Hub 전원이 켜져 있는지 확인하세요\n• Hub가 다른 기기와 연결되어 있으면 먼저 끊어주세요\n• Hub를 껐다가 다시 켜서 재시도하세요')), 10000)
                    )
                ]);
            } catch (e) {
                throw new Error(`GATT 서버 연결 실패: ${e.message}`);

            }

            await new Promise(r => setTimeout(r, 800));

            // [2단계] Primary Service 가져오기 (LEGO LWP 먼저, 없으면 Nordic UART 시도)
            let service;
            try {
                service = await server.getPrimaryService(LEGO_HUB_SERVICE_ID);
            } catch (e1) {
                try {
                    service = await server.getPrimaryService(NORDIC_UART_SERVICE);
                } catch (e2) {
                    throw new Error(`서비스 첣기 실패.\nLEGO 서비스: ${e1.message}\nNordic UART: ${e2.message}`);
                }
            }

            // [3단계] Characteristic 가져오기
            try {
                window.rxCharacteristic = await service.getCharacteristic(LEGO_HUB_CHARACTERISTIC_ID)
                    .catch(() => service.getCharacteristic(NORDIC_UART_RX));
                window.txCharacteristic = window.rxCharacteristic;
            } catch (e) {
                throw new Error(`Characteristic 첣기 실패: ${e.message}`);
            }

            window.connectionType = 'BLE';
            updateUI('BLE');

            try {
                const monitorChannel = new BroadcastChannel('bricksync_monitor');
                let studentName = 'Guest_익명';
                const sessionDataStr = localStorage.getItem('bricksync_student_session');
                if (sessionDataStr) {
                    const sessionData = JSON.parse(sessionDataStr);
                    if (Date.now() < sessionData.expires) studentName = sessionData.name;
                }
                monitorChannel.postMessage({
                    type: 'SYSTEM',
                    msg: `레고 스파이크 허브 블루투스 연결 성공 🔵`,
                    student: studentName
                });
            } catch (e) { }

            // [4단계] Notification 시작
            try {
                await window.txCharacteristic.startNotifications();
                window.txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);
            } catch (e) {
                throw new Error(`Notification 시작 실패: ${e.message}`);
            }

            // [5단계] 모든 포트 센서 구독 (외부 포트 A~F)
            for (let p = 0; p < 6; p++) {
                const subscribeMsg = new Uint8Array([10, 0, 0x41, p, 0, 1, 0, 0, 0, 1]);
                try { await window.txCharacteristic.writeValueWithoutResponse(subscribeMsg); } catch (e) { }
                await new Promise(r => setTimeout(r, 30));
            }

            // [6단계] 내장 IMU 센서 구독 (포트 99 - 자이로/가속도)
            // LEGO SPIKE 내장 IMU는 LWP3 프로토콜로 명시적 구독이 필요
            const imuPorts = [97, 98, 99]; // 허브 펌웨어 버전에 따라 포트 다름
            for (const imuPort of imuPorts) {
                // mode 0: acceleration, mode 3: tilt angle
                for (const mode of [0, 3]) {
                    const imuMsg = new Uint8Array([10, 0, 0x41, imuPort, mode, 1, 0, 0, 0, 1]);
                    try { await window.txCharacteristic.writeValueWithoutResponse(imuMsg); } catch (e) { }
                    await new Promise(r => setTimeout(r, 30));
                }
            }
            console.log('[BLE] 내장 IMU 구독 완료 (port 97/98/99, mode 0/3)');
        }

        window.isReconnecting = false;
        // [BUG-01 FIX] 재귀 호출 제거: setTimeout + 최대 재시도 횟수(maxRetries) 제한으로 교체
        // 이전 코드는 catch 블록에서 startBackgroundReconnect()를 재귀 호출하여
        // 연결이 계속 실패할 경우 콜 스택이 무한히 쌓이는 스택 오버플로우 위험이 있었음.
        async function startBackgroundReconnect(device, retryCount = 0) {
            const MAX_RETRIES = 10; // 최대 재시도 10회 (약 20초)
            if (window.connectionType || window.isReconnecting) return;
            if (retryCount >= MAX_RETRIES) {
                console.warn(`[BLE] 백그라운드 재연결 포기: ${MAX_RETRIES}회 시도 후 실패`);
                return;
            }
            window.isReconnecting = true;
            try {
                await connectBluetoothDevice(device);
                console.log("SPA 백그라운드 자동 복원 성공!");
            } catch (e) {
                console.warn(`[BLE] 재연결 시도 ${retryCount + 1}/${MAX_RETRIES} 실패:`, e.message || e);
                // 재귀 대신 setTimeout으로 다음 시도 예약 (지수 백오프: 2s → 4s → 최대 8s)
                const delay = Math.min(2000 * Math.pow(1.5, retryCount), 8000);
                setTimeout(() => startBackgroundReconnect(device, retryCount + 1), delay);
            } finally {
                // finally 블록으로 플래그 해제를 보장하여 플래그가 영구 잠기는 문제 방지
                window.isReconnecting = false;
            }
        }

        // =================================================================================
        // 안티그라비티 전역 제스처 복원 기법 비활성화 (프로젝트 카드 클릭 먹통 버그 방지)
        // =================================================================================
        /*
        let isSilentReconnecting = false;
        async function silentReconnectAttempt() {
            if (window.connectionType || isSilentReconnecting || !navigator.bluetooth || !navigator.bluetooth.getDevices) return;
            try {
                const devices = await navigator.bluetooth.getDevices();
                if (devices.length > 0) {
                    isSilentReconnecting = true;
                    try { await connectBluetoothDevice(devices[0]); }
                    catch (err) { }
                    finally { isSilentReconnecting = false; }
                }
            } catch (error) { }
        }

        document.body.addEventListener('pointerdown', silentReconnectAttempt, { capture: true });
        */

        // iframe 내부에서 클릭이 일어날 때도 부모창이 알아채서 복구하도록 트리거 바인딩 (onload마다 갱신)
        document.getElementById('main-frame').addEventListener('load', function () {
            // 현재 이동한 페이지를 세션에 저장하여 새로고침(F5) 시에도 유지
            try {
                const win = this.contentWindow;
                const currentFile = win.location.pathname.split('/').pop() + win.location.search;
                if (currentFile && !currentFile.startsWith('app.html')) {
                    sessionStorage.setItem('brickSyncLastPage', currentFile);
                }
            } catch (e) { }

            // iframe 페이지 렌더링 후 상태 동기화를 위해 UI 1회 자동 업데이트
            if (window.connectionType !== null) {
                updateUI(window.connectionType);
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                updateWsUI(ws.readyState === WebSocket.OPEN);
            }
            /*
            try {
                this.contentWindow.document.body.addEventListener('pointerdown', silentReconnectAttempt, { capture: true });
            } catch (e) { }
            */
        });

        
        function getCurrentUnit() {
            try {
                const iframe = document.getElementById('main-frame');
                if (iframe && iframe.contentWindow) {
                    const url = new URL(iframe.contentWindow.location.href);
                    return url.searchParams.get('unit') || '0';
                }
            } catch (e) { }
            try {
                const lastPage = sessionStorage.getItem('brickSyncLastPage');
                if (lastPage) {
                    const url = new URL(lastPage, window.location.origin);
                    return url.searchParams.get('unit') || '0';
                }
            } catch (e) { }
            return '0';
        }

function handleBLEData(event) {
            const value = event.target.value;
            if (value.byteLength < 3) return;
            const msgType = value.getUint8(2);

            if (msgType === 0x04 && value.byteLength >= 7) {
                const portID = value.getUint8(3);
                const eventType = value.getUint8(4);
                if (!window.hubDevices) window.hubDevices = {};

                if (eventType === 0x01) {
                    const ioType = value.getUint16(5, true);
                    window.hubDevices[portID] = ioType;

                    if (ioType === 57 || ioType === 59 || ioType === 61) {
                        const subscribeMsg = new Uint8Array([10, 0, 0x41, portID, 0, 1, 0, 0, 0, 1]);
                        if (window.txCharacteristic) window.txCharacteristic.writeValueWithoutResponse(subscribeMsg).catch(e => { });
                    }
                } else if (eventType === 0x00) {
                    delete window.hubDevices[portID];
                }
            } else if (msgType === 0x45) {
                const portID = value.getUint8(3);
                if (!window.sensorData) window.sensorData = {};

                // 허브 내장 자이로/가속도 센서 (Port 99)
                if (portID === 99 && value.byteLength >= 8) {
                    const rawX = value.getInt16(4, true);
                    const rawY = value.getInt16(6, true);
                    const threshold = (Math.abs(rawX) > 100 || Math.abs(rawY) > 100) ? 250 : 25;

                    if (window.initialX === null || window.initialY === null) {
                        window.initialX = rawX;
                        window.initialY = rawY;
                        return;
                    }

                    // 자이로 기울기 센서(Port 99) -> 오직 1단원, 2단원에서만 키보드 가상 입력 활성화
                    const currentUnit = getCurrentUnit();
                    if (currentUnit === '1' || currentUnit === '2') {
                        const adjX = rawX - window.initialX;
                        const adjY = rawY - window.initialY;

                        let x_state = "CENTER_X", y_state = "CENTER_Y";
                        if (adjY > threshold) y_state = "TILT_UP"; else if (adjY < -threshold) y_state = "TILT_DOWN";
                        if (adjX > threshold) x_state = "TILT_RIGHT"; else if (adjX < -threshold) x_state = "TILT_LEFT";

                        // --- 🔒 시소 이펙트 철통 방어 (연속 3프레임 이상 안정성 검증) 🔒 ---
                        // 흔들림 및 조작 혼선 시 1~2프레임 단위로 상태가 널뛰며 발생하는 키 씹힘 및 Stuck 현상 원천 예방
                        if (window.candidateXState === x_state) {
                            window.consecutiveXFrames++;
                            if (window.consecutiveXFrames >= 3 && window.lastStableXState !== x_state) {
                                window.lastStableXState = x_state;
                                updateState("LEFT", x_state === "TILT_LEFT", "STEER_LEFT", "STOP_LEFT");
                                updateState("RIGHT", x_state === "TILT_RIGHT", "STEER_RIGHT", "STOP_RIGHT");
                            }
                        } else {
                            window.candidateXState = x_state;
                            window.consecutiveXFrames = 1;
                        }

                        if (window.candidateYState === y_state) {
                            window.consecutiveYFrames++;
                            if (window.consecutiveYFrames >= 3 && window.lastStableYState !== y_state) {
                                window.lastStableYState = y_state;
                                updateState("UP", y_state === "TILT_UP", "STEER_UP", "STOP_UP");
                                updateState("DOWN", y_state === "TILT_DOWN", "STEER_DOWN", "STOP_DOWN");
                            }
                        } else {
                            window.candidateYState = y_state;
                            window.consecutiveYFrames = 1;
                        }
                    } else {
                        // 타 단원에서는 불필요한 키 해제 신호가 반복 전송되지 않도록 아무것도 하지 않음 (서버 과부하 방지)
                    }
                }
                // 외부 센서: 컬러 센서(61) 등
                else if (portID < 6 && value.byteLength === 5) {
                    const colorVal = value.getInt8(4);
                    window.sensorData[portID] = colorVal; // 스파이크 내부의 색상 코드 번호 (0~10)
                }
            }
        }

        function updateState(direction, isPressed, activateCmd, deactivateCmd) {
            if (isPressed && !window.activeStates[direction]) {
                sendCommand(activateCmd);
                window.activeStates[direction] = true;
                logToIframe("🎮 " + activateCmd);
            } else if (!isPressed && window.activeStates[direction]) {
                sendCommand(deactivateCmd);
                window.activeStates[direction] = false;
                logToIframe("🛑 " + deactivateCmd);
            }
        }

        function logToIframe(msg) {
            const iframe = document.getElementById("main-frame").contentWindow;
            if (iframe && iframe.addLog) {
                iframe.addLog(msg);
            }
        }

        async function readLoopUSB() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = window.port.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();
            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) { reader.releaseLock(); break; }
                    if (value) {
                        buffer += value;
                        let lines = buffer.split('\n');
                        buffer = lines.pop();
                        processLines(lines);
                    }
                }
            } catch (error) { }
        }

        function processLines(lines) {
            for (let line of lines) {
                line = line.trim();
                if (line.length === 0) continue;
                logToIframe("RAW: " + line);
                if (line.includes("MSG_ITEM_GRANT")) {
                    console.log("🎁 허브 메시지 감지 -> 우클릭 발사!");
                    try { window.sendWebSocketAction({ action: "ITEM_GRANT_REWARD" }); } catch (e) { }
                }
                if (line.includes("Mission Complete!")) {
                    console.log("🏆 미션 완료 메시지 수신!");
                    const iframe = document.getElementById("main-frame").contentWindow;
                    if (iframe && typeof iframe.onUsbMissionComplete === 'function') {
                        iframe.onUsbMissionComplete();
                    }
                }
                if (line.includes("|")) {
                    const parts = line.split("|");
                    const x_state = parts[0] || "", y_state = parts[1] || "";
                    updateState("LEFT", x_state.includes("TILT_LEFT"), "STEER_LEFT", "STOP_LEFT");
                    updateState("RIGHT", x_state.includes("TILT_RIGHT"), "STEER_RIGHT", "STOP_RIGHT");
                    updateState("UP", y_state.includes("TILT_UP"), "STEER_UP", "STOP_UP");
                    updateState("DOWN", y_state.includes("TILT_DOWN"), "STEER_DOWN", "STOP_DOWN");
                }
            }
        }
    
        // --- 부모 창에서 아이프레임을 일정한 가로세로 비율로 벡터 축소하는 엔진 --- //
        function adjustIframeScale() {
            const iframe = document.getElementById('main-frame');
            if (!iframe) return;

            const baselineWidth = 1500; // 줄바꿈이 일어나지 않는 기준 데스크톱 가로 너비
            const currentWidth = window.innerWidth;

            if (currentWidth < baselineWidth) {
                const scale = Math.max(0.4, currentWidth / baselineWidth);
                
                // 가상 해상도를 확보하기 위해 아이프레임을 확대하여 렌더링 공간 제공
                iframe.style.width = (100 / scale) + '%';
                iframe.style.height = (100 / scale) + '%';
                // 전체 가상 공간을 현재 화면 크기에 맞추어 매끄럽게 축소
                iframe.style.transform = 'scale(' + scale + ')';
                iframe.style.transformOrigin = 'top left';
            } else {
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.transform = 'none';
                iframe.style.transformOrigin = 'top left';
            }
        }

        window.addEventListener('resize', adjustIframeScale);
        window.addEventListener('DOMContentLoaded', adjustIframeScale);
        
        // 아이프레임이 새로 로드될 때도 항상 축소 상태 동기화 및 가상 입력 키 릴리즈
        const mainIframe = document.getElementById('main-frame');
        if (mainIframe) {
            mainIframe.addEventListener('load', () => {
                adjustIframeScale();
                try { window.sendWebSocketAction({ action: "CLEANUP_KEYS" }); } catch (e) {}
            });
        }
