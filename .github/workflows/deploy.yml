name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'BrickSync-main/bricksync_project/web_app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy BrickSync Web App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        working-directory: BrickSync-main/bricksync_project/web_app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6512cc54d8d751cc55098483f415cb72"
        run: wrangler deploy --log-level debug
