<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="bs_scale.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrickSync — 학부모 리포트</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans KR','Outfit',sans-serif}
body{background:#0f172a;color:#f1f5f9;min-height:calc(100vh / var(--bs-z,1));display:flex}

.sidebar{width:240px;background:#1e293b;border-right:1px solid #334155;padding:24px 16px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.sidebar-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 8px;margin-bottom:16px;width:100%}
.sidebar-logo{max-width:160px;width:100%;height:auto;display:block;margin:0 auto;object-fit:contain}
.sidebar-subtext{font-size:.75rem;color:#94a3b8;font-weight:600;display:block;margin-top:6px;text-align:center}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#94a3b8;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:#0f172a;color:#fff}
.nav-item.active{background:linear-gradient(135deg,#db2777,#9333ea);color:#fff}
.nav-item i{width:18px;text-align:center}
.sidebar-bottom{margin-top:auto}
.parent-badge{background:#0f172a;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.parent-badge .avatar{width:36px;height:36px;background:linear-gradient(135deg,#db2777,#9333ea);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;flex-shrink:0}
.parent-badge .name{font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parent-badge .role-label{font-size:.72rem;color:#db2777;font-weight:700}

.main{flex:1;padding:32px;overflow-y:auto}
.page-title{font-size:1.6rem;font-weight:900;margin-bottom:6px}
.page-subtitle{color:#64748b;font-size:.9rem;margin-bottom:28px}

/* 자녀 선택 카드 */
.child-card{background:linear-gradient(135deg,rgba(219,39,119,.15),rgba(147,51,234,.15));border:1px solid rgba(219,39,119,.3);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:16px;margin-bottom:28px}
.child-avatar{width:56px;height:56px;background:linear-gradient(135deg,#db2777,#9333ea);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;flex-shrink:0}
.child-name{font-size:1.3rem;font-weight:900}
.child-class{font-size:.85rem;color:#94a3b8;margin-top:3px}

/* 통계 카드 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.1}
.stat-card.pink::before{background:#db2777}
.stat-card.purple::before{background:#9333ea}
.stat-card.blue::before{background:#3b82f6}
.stat-card.green::before{background:#10b981}
.stat-card .icon{font-size:1.4rem;margin-bottom:10px}
.stat-card .label{color:#64748b;font-size:.78rem;font-weight:700;margin-bottom:6px}
.stat-card .value{font-size:1.9rem;font-weight:900}
.stat-card .sub{font-size:.72rem;color:#94a3b8;margin-top:4px}

/* 패널 */
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:1100px){.panel-grid{grid-template-columns:1fr}}
.panel{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px}
.panel-title{font-size:1rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:#f1f5f9}
.panel-title i{color:#db2777}

/* 활동 로그 */
.activity-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;background:#0f172a;border-radius:10px;border-left:3px solid #334155}
.activity-item.lesson{border-color:#6366f1}
.activity-item.ai{border-color:#db2777}
.activity-item.mission{border-color:#10b981}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.activity-item.lesson .activity-dot{background:#6366f1}
.activity-item.ai .activity-dot{background:#db2777}
.activity-item.mission .activity-dot{background:#10b981}
.activity-text{font-size:.85rem;font-weight:600;line-height:1.4}
.activity-time{font-size:.73rem;color:#64748b;margin-top:2px}

/* 미션 진행도 */
.mission-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #0f172a}
.mission-row:last-child{border-bottom:none}
.mission-name{font-size:.85rem;font-weight:700;flex:1}
.mission-bar-wrap{flex:2;background:#0f172a;border-radius:20px;height:8px;overflow:hidden}
.mission-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,#db2777,#9333ea);transition:width .8s ease}
.mission-pct{font-size:.8rem;font-weight:700;color:#db2777;width:36px;text-align:right}

/* 주간 활동 차트 (CSS only) */
.week-chart{display:flex;align-items:flex-end;gap:8px;height:80px;padding:0 4px}
.week-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.week-bar-fill{width:100%;background:linear-gradient(180deg,#db2777,#9333ea);border-radius:4px 4px 0 0;transition:height .6s ease;min-height:4px}
.week-day{font-size:.68rem;color:#64748b;font-weight:700}

.empty-state{text-align:center;padding:28px;color:#475569;font-size:.88rem}
.empty-state i{font-size:1.8rem;margin-bottom:10px;display:block}

.loading{text-align:center;padding:20px;color:#64748b}
.loading i{animation:spin 1s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.15);color:#10b981}
.badge-yellow{background:rgba(234,179,8,.15);color:#eab308}
.badge-gray{background:rgba(100,116,139,.1);color:#64748b}

.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;border:1px solid #334155;color:#f8fafc;padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:700;z-index:9999;transform:translateY(80px);transition:.3s;opacity:0}
.toast.show{transform:translateY(0);opacity:1}

/* ===== 메인 화면 스타일: 파스텔 배경 + 유리 사이드바 + 흰 카드 ===== */
html{background-color:#cfd8ee}
body{background:transparent!important;background-image:none!important;color:#2b1b4d;position:relative}
body::before{content:'';position:fixed;inset:0;background:url('assets/main_bg.jpg') center/cover no-repeat;z-index:-1}
.sidebar{background:rgba(255,255,255,.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid rgba(255,255,255,.75);box-shadow:0 0 40px rgba(43,27,77,.12)}
.sidebar-subtext{color:#5b5478}
.nav-item{color:#2b1b4d}
.nav-item:hover{background:rgba(255,255,255,.78);color:#6c1f86;box-shadow:0 4px 14px rgba(43,27,77,.12)}
.nav-item.active{background:#6c1f86;color:#fff;box-shadow:0 6px 18px rgba(108,31,134,.32)}
.nav-item.active i{color:#facc15}
.parent-badge{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85)}
.parent-badge .avatar,.child-avatar{background:#edbd95;color:#2b1b4d}
.parent-badge .role-label{color:#6c1f86}
.page-title{color:#2b1b4d}
.page-subtitle{color:#3f3a63;font-weight:600}
.child-card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(43,27,77,.12)}
.child-class{color:#5b5478}
.stat-card,.panel{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(43,27,77,.12)}
.stat-card::before{opacity:.5}
.stat-card.pink::before{background:#e6a8b8}
.stat-card.purple::before{background:#cfc3e6}
.stat-card.blue::before{background:#a9c8e8}
.stat-card.green::before{background:#a0c9c3}
.stat-card .label{color:#5b5478}
.stat-card .sub{color:#7a7396}
.panel-title{color:#2b1b4d}
.panel-title i{color:#6c1f86}
.activity-item{background:#f6fbfe;border-left-color:#d6edf5}
.activity-item.lesson{border-color:#a5b1d7}
.activity-item.ai{border-color:#e6a8b8}
.activity-item.mission{border-color:#a0c9c3}
.activity-item.lesson .activity-dot{background:#a5b1d7}
.activity-item.ai .activity-dot{background:#e6a8b8}
.activity-item.mission .activity-dot{background:#a0c9c3}
.activity-time{color:#7a7396}
.mission-row{border-bottom-color:#d6edf5}
.mission-bar-wrap{background:#e2f5f9}
.mission-pct{color:#6c1f86}
.week-bar-fill{background:linear-gradient(180deg,#edbd95,#a5b1d7)}
.week-day{color:#7a7396}
.empty-state,.loading{color:#7a7396}
.badge-green{background:#e8f4f2;color:#2f7a4d}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-gray{background:#eef0f6;color:#7a7396}
.toast{background:#fff;border:1.5px solid #cfe9f2;color:#2b1b4d;box-shadow:0 10px 30px rgba(43,27,77,.2)}
.bs-stars{display:inline-flex;gap:2px;vertical-align:middle}
.bs-star{fill:#e2dff0;stroke:#cfc9e6;stroke-width:1}
.bs-star.on{fill:#f6b73c;stroke:#e09a14}
.bs-rate{display:inline-flex;gap:4px}
.bs-rate button{background:none;border:none;padding:2px;cursor:pointer;line-height:0}
.bs-rate button:focus-visible{outline:3px solid #a5b1d7;border-radius:6px}
.rp-item{border:1px solid #d6edf5;background:#f6fbfe;border-radius:12px;padding:16px 18px;margin-bottom:12px}
.rp-head{font-size:.8rem;color:#7a7396;margin-bottom:8px}
.rp-body{white-space:pre-wrap;word-break:keep-all;color:#2b1b4d;font-size:.95rem;line-height:1.7}
.rp-review{margin-top:14px;padding-top:12px;border-top:1px dashed #cfe9f2}
.rp-review-title{font-size:.85rem;font-weight:800;color:#2b1b4d;margin-bottom:6px}
.rp-review textarea{width:100%;min-height:76px;resize:vertical;margin-top:8px;background:#fff;border:1.5px solid #cfe9f2;border-radius:10px;padding:10px 12px;color:#2b1b4d;font-family:inherit;font-size:.9rem;line-height:1.55;outline:none}
.rp-review textarea:focus{border-color:#a5b1d7;box-shadow:0 0 0 3px rgba(165,177,215,.35)}
.rp-review-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.rp-saved{font-size:.78rem;color:#7a7396}
.btn-rp{padding:9px 18px;background:#6c1f86;border:none;border-radius:10px;color:#fff;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #4a1360}
.btn-rp:active{transform:translateY(2px);box-shadow:0 2px 0 #4a1360}
.btn-rp:disabled{opacity:.6;cursor:default}
.sidebar-bottom{position:fixed;top:14px;right:22px;z-index:60;margin:0;display:flex;align-items:center;gap:8px}
.teacher-badge,.parent-badge{margin:0 !important;padding:6px 16px 6px 8px !important;border-radius:999px !important;box-shadow:0 4px 14px rgba(43,27,77,.12)}
.sidebar-bottom .nav-item{width:auto;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);font-size:.85rem;box-shadow:0 4px 14px rgba(43,27,77,.12);white-space:nowrap}
.main{padding-top:36px}
@media(max-width:760px){.sidebar-bottom{position:static;padding:8px 12px}}
.detail-box{background:#e7f4fa;border:1.5px solid #a5b1d7;border-radius:16px;padding:12px;margin-bottom:20px}
.detail-frame{width:100%;height:900px;border:0;background:transparent;display:block}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="./assets/bs_logo_vertical.png" alt="BrickSync" class="sidebar-logo">
    <span class="sidebar-subtext">학부모 리포트</span>
  </div>
  <button class="nav-item active" onclick="showSection('report')"><i class="fas fa-chart-line"></i> 학습 리포트</button>
</aside>

  <div class="sidebar-bottom">
    <div class="parent-badge">
      <div class="avatar" id="sidebarAvatar">P</div>
      <div>
        <div class="name" id="sidebarName">로딩 중...</div>
        <div class="role-label">학부모 계정</div>
      </div>
    </div>
    <button class="nav-item" onclick="BrickSyncAuth.signOut()"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
  </div>

<main class="main" id="mainContent">
  <div class="loading"><i class="fas fa-spinner"></i> 로딩 중...</div>
</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<!-- firebase-auth-compat disabled for Firestore Cloud Auth Engine -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase_config.js"></script>
<script src="auth.js"></script>
<script src="reports.js"></script>

<script>
let parentProfile = null;
let studentProfile = null;

(async () => {
  const session = await BrickSyncAuth.requireRole(['parent']);
  if (!session) return;
  parentProfile = session.profile;

  const n = parentProfile.displayName || '학부모';
  document.getElementById('sidebarName').textContent = n;
  document.getElementById('sidebarAvatar').textContent = n[0];

  // 연결된 자녀 프로필 (클라우드 → 가입 때 저장한 정보 순서, 실패해도 화면은 계속 그린다)
  const sUid = parentProfile.linkedStudentUid;
  if (sUid && firestore) {
    try {
      const doc = await Promise.race([firestore.collection('users').doc(sUid).get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
      if (doc.exists) studentProfile = doc.data();
    } catch (e) { console.warn('[Parent] 자녀 정보 조회 실패:', e); }
  }
  if (!studentProfile && parentProfile.linkedStudentName) {
    studentProfile = { displayName: parentProfile.linkedStudentName, className: parentProfile.linkedClassName || '', email: '' };
  }

  showSection('report');
})();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showSection(section) {
  renderReport();
}

// ── 자녀 헤더 카드 HTML ────────────────────────────────────────
function childHeader() {
  if (!studentProfile) return `<div class="child-card"><div class="child-avatar">?</div><div><div class="child-name">자녀 정보 없음</div><div class="child-class">연결된 학생이 없습니다. 선생님께 받은 학부모 코드로 다시 가입해 주세요.</div></div></div>`;
  const initial = (studentProfile.displayName || '?')[0];
  return `<div class="child-card">
    <div class="child-avatar">${initial}</div>
    <div>
      <div class="child-name">${studentProfile.displayName}</div>
      <div class="child-class">${studentProfile.className || ''} · ${studentProfile.email || ''}</div>
    </div>
    <span class="badge badge-green" style="margin-left:auto">연결됨 ✓</span>
  </div>`;
}

// ── 학습 리포트 (자녀 학습 현황 + 선생님 리포트 + 리뷰, 한 페이지) ──
function renderReport() {
  const name = parentProfile.linkedStudentName || (studentProfile && studentProfile.displayName) || '';
  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">학습 리포트</div>
    <div class="page-subtitle">자녀의 학습 현황과 선생님 리포트를 확인하고, 만족도와 의견을 남겨 주세요.</div>
    ${childHeader()}
    ${name ? `<div class="detail-box"><iframe class="detail-frame" id="childFrame" src="dashboard_v2.html?student=${encodeURIComponent(name)}&embed=1" title="학습 현황"></iframe></div>` : ''}
    <div class="panel">
      <div class="panel-title"><i class="fas fa-pen-to-square"></i> 선생님 리포트</div>
      <div id="trList"><div class="empty-state"><i class="fas fa-spinner"></i>불러오는 중...</div></div>
    </div>`;
  fillTeacherReports();
}

// iframe(학습 현황)이 알려 주는 높이에 맞춰 늘린다
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const h = e.data && e.data.bsEmbedHeight;
  const f = document.getElementById('childFrame');
  if (h && f && e.source === f.contentWindow) f.style.height = Math.ceil(h) + 'px';
});

// ── 선생님 리포트 + 리뷰/별점 ────────────────────────────────
let reportIndex = {};
let ratingDraft = {};

function pEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pDate(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return '';
  return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
}

function rateButtons(reportId, value) {
  let h = '<span class="bs-rate" id="rate_' + pEsc(reportId) + '" role="radiogroup" aria-label="만족도 별점">';
  for (let i = 1; i <= 5; i++) {
    h += '<button type="button" role="radio" aria-checked="' + (i === value) + '" aria-label="' + i + '점" onclick="setRating(\'' + pEsc(reportId) + '\',' + i + ')">' + BrickSyncReports.starIcon(i <= value, 28) + '</button>';
  }
  return h + '</span>';
}

function setRating(reportId, v) {
  ratingDraft[reportId] = v;
  const box = document.getElementById('rate_' + reportId);
  if (box) box.outerHTML = rateButtons(reportId, v);
}

async function fillTeacherReports() {
  const sUid = parentProfile.linkedStudentUid;
  const el = document.getElementById('trList');
  if (!sUid) {
    el.innerHTML = '<div class="empty-state"><i class="fas fa-link"></i>연결된 학생이 없습니다. 선생님께 받은 학부모 코드로 다시 가입해 주세요.</div>';
    return;
  }
  const [rp, fb] = await Promise.all([BrickSyncReports.listReports(sUid), BrickSyncReports.listFeedback(sUid)]);
  if (!document.getElementById('trList')) return;
  reportIndex = {}; ratingDraft = {};
  if (!rp.list.length) {
    el.innerHTML = '<div class="empty-state"><i class="fas fa-pen-to-square"></i>아직 선생님이 남긴 리포트가 없습니다.</div>';
    return;
  }
  const mine = {};
  fb.list.filter(f => f.parentUid === parentProfile.uid).forEach(f => { mine[f.reportId] = f; });
  el.innerHTML = rp.list.map(r => {
    reportIndex[r.id] = r;
    const m = mine[r.id];
    ratingDraft[r.id] = m ? Number(m.rating) || 0 : 0;
    return `<div class="rp-item">
      <div class="rp-head">${pEsc(pDate(r.createdAt))} · ${pEsc(r.teacherName || '선생님')}${r.updatedAt && r.updatedAt !== r.createdAt ? ' (수정됨)' : ''}</div>
      <div class="rp-body">${pEsc(r.text)}</div>
      <div class="rp-review">
        <div class="rp-review-title">이 리포트에 대한 만족도</div>
        ${rateButtons(r.id, ratingDraft[r.id])}
        <textarea id="fbText_${pEsc(r.id)}" maxlength="1000" placeholder="선생님께 전하고 싶은 의견을 적어 주세요. (선택)">${pEsc(m ? m.text : '')}</textarea>
        <div class="rp-review-row">
          <span class="rp-saved" id="fbSaved_${pEsc(r.id)}">${m ? pEsc(pDate(m.updatedAt)) + ' 저장됨' : ''}</span>
          <button class="btn-rp" onclick="submitFeedback('${pEsc(r.id)}')">${m ? '수정하기' : '남기기'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function submitFeedback(reportId) {
  const r = reportIndex[reportId];
  const rating = ratingDraft[reportId] || 0;
  if (!r) return;
  if (rating < 1) { showToast('별점을 먼저 선택해 주세요.'); return; }
  const text = document.getElementById('fbText_' + reportId).value;
  try {
    const res = await BrickSyncReports.saveFeedback({
      reportId, studentUid: r.studentUid, teacherUid: r.teacherUid,
      parentUid: parentProfile.uid, parentName: parentProfile.displayName || '학부모', rating, text
    });
    showToast(res.cloudOk ? '소중한 의견 감사합니다.' : '이 기기에만 저장됐어요. 선생님께 보이려면 인터넷 연결을 확인해 주세요.');
    const s = document.getElementById('fbSaved_' + reportId);
    if (s) s.textContent = pDate(new Date().toISOString()) + ' 저장됨';
  } catch (e) { showToast('저장하지 못했어요: ' + e.message); }
}
</script>
<script src="dash_i18n.js"></script>
<script src="settings.js"></script>
