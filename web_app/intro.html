<!DOCTYPE html>

    <!-- intro.html: 독립 랜딩 페이지 - 리다이렉트 없음 -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브릭싱크 (BrickSync) - 시작하기</title>
    <!-- 고급스러운 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: calc(100vh / var(--bs-z, 1));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* 로딩바를 화면 하단부에 배치 */
            align-items: center;
            /* 전달해주신 레고 포트나이트 이미지를 꽉 차게 배경으로 설정 */
            background-image: url('./assets/intro_bg.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            color: #2b1b4d;
            background-color: #cfd8ee;
            position: relative;
            overflow: hidden;
            padding-bottom: 80px;
            /* 맨 아래에서 살짝 띄우기 위함 */
        }

        /* 텍스트 가독성을 위해 배경을 살짝 어둡게 깔아주는 오버레이 (선택사항) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: none;
            z-index: 1;
        }

        /* 배경 장식 애니메이션 효과 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
        }

        .circle-1 {
            width: 600px;
            height: 600px;
            top: -200px;
            left: -200px;
            animation: float 10s ease-in-out infinite;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            right: -100px;
            animation: float 8s ease-in-out infinite reverse;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 30px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* ── 반응형 IntroLogo ── */
        .intro-logo {
            position: absolute;
            /* svh = URL바 포함 모바일 실제 화면 기준, 정확한 중앙 */
            top: calc(50vh / var(--bs-z, 1));
            top: calc(50svh / var(--bs-z, 1)); /* 모던 모바일 브라우저 우선 적용 */
            left: 50%;
            transform: translate(-50%, -50%);

            /* 양쪽 여백 1cm씩, 최대 800px */
            width: min(calc(100vw / var(--bs-z, 1) - 2cm), 800px);
            height: auto;

            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 4px 24px rgba(0,0,0,0.45));
        }

        .content-wrapper {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
        }

        /* 타이틀 박스 (블러된 글래스 모피즘 효과) */
        /* .title-container {
            width: 100%;

             등장 애니메이션
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        } */

            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -1px;
            네온 그라데이션 텍스트
            background: linear-gradient(to right, #60a5fa, #c084fc, #f472b6);
            -webkit-background-clip: text;

        /* 시작 버튼 */
        .start-btn {
            background: rgba(20, 14, 40, 0.38);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            background: rgba(20, 14, 40, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* 얇은 로딩 바 래퍼 (초기에는 숨김) */
        .loading-wrapper {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        /* 아주 얇고 세련된 로딩 바 박스 배경 */
        .loading-container {
            width: 100%;
            height: 6px;
            background: rgba(43, 27, 77, 0.18);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(43, 27, 77, 0.18);
            /* 등장 애니메이션 */
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
        }

        /* 차오르는 프로그레스 바 */
        .loading-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: #6c1f86;
            z-index: 1;
            transition: width 0.1s linear;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(108, 31, 134, 0.35);
        }

        /* 상태 텍스트 (옵션, 로딩바 위에 띄움) */
        .loading-text {
            z-index: 10;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2b1b4d;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* 하단 저작권 텍스트 */
        .copyright {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: rgba(43, 27, 77, 0.75);
            font-weight: 500;
            letter-spacing: 1px;
            z-index: 10;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
<style id="bs-page-transition">
/* 페이지가 바뀔 때 번쩍이지 않고 부드럽게 겹쳐 바뀌게 한다 (크롬/엣지 126 이상, 그 외는 예전처럼 넘어감) */
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.35s; }
/* 페이지가 아직 그려지기 전에도 흰색이 비치지 않게 같은 파스텔 바탕색 */
html { background-color: #cfd8ee; }
</style>
    <!-- 다음 화면을 미리 받아 둔다 -->
    <link rel="preload" as="image" href="./assets/login_bg_blur.jpg">
    <link rel="preload" as="image" href="./assets/bs_logo_vertical.png">
    <script src="server_boot.js"></script>
    <script>try { BrickSyncBoot.sync(); } catch (e) {}</script>
    <link rel="prefetch" href="login.html">
</head>

<body>

    <!-- 둥둥 떠다니는 배경 장식 -->
    <!-- (새 배경 이미지에서는 쓰지 않음)
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    -->

    <!-- 반응형 인트로 로고 (양쪽 1cm 여백, 화면 크기 맞춤형) -->
    <!-- (로고는 배경 이미지 안에 들어 있어 따로 올리지 않음)
    <img class="intro-logo" src="./assets/IntroLogo.webp" alt="LEGO Fortnite">
    -->

    <div class="content-wrapper">
        <!-- 타이틀 영역 -->
        <!-- <div class="title-container">
            <div class="title-text">BrickSync</div>
            <div class="subtitle-text">PHYSICAL × DIGITAL PLAYGROUND</div>
        </div> -->

        <!-- 시작 버튼 -->
        <button class="start-btn" id="startBtn" onclick="startLoading()">시스템 접속</button>

        <!-- 로딩 애니메이션 영역 (초기 숨김) -->
        <div class="loading-wrapper" id="loadingWrapper">
            <div class="loading-text" id="loadingText">시스템 로드 중...</div>

            <!-- 얇은 로딩 바 영역 -->
            <div class="loading-container" id="loadingBox">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
        </div>
    </div>

    <!-- 하단 저작권 영역 -->
    <div class="copyright">
        © 2026 BrickSync. All rights reserved.
    </div>

    <script>
        let isLoading = false;

        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('bricksync_lang') || 'ko';
            if (lang === 'en') {
                const btn = document.getElementById('startBtn');
                const txt = document.getElementById('loadingText');
                if (btn) btn.textContent = 'Connect System';
                if (txt) txt.textContent = 'Loading System...';
            }
        });

        function startLoading() {
            if (isLoading) return;
            isLoading = true;

            const lang = localStorage.getItem('bricksync_lang') || 'ko';
            const isEn = lang === 'en';

            // 버튼 숨기고 로딩바 띄우기
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('loadingWrapper').style.display = 'flex';
            const loadingBar = document.getElementById('loadingBar');
            const loadingText = document.getElementById('loadingText');
            let progress = 0;

            // 그럴싸한 가짜 로딩 애니메이션
            const interval = setInterval(() => {
                // 게임 진입처럼 빠르게 올라가도록 수정
                progress += Math.random() * 5 + 1;

                if (progress > 30 && progress < 40) loadingText.innerText = isEn ? "Connecting to server..." : "서버 컨넥팅 중...";
                if (progress > 60 && progress < 70) loadingText.innerText = isEn ? "Preparing Fortnite sync..." : "포트나이트 연동 준비 중...";
                if (progress > 90 && progress < 99) loadingText.innerText = isEn ? "Finalizing..." : "완료 중...";

                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    loadingText.innerText = isEn ? "Entering!" : "진입 중!";

                    // index.html 로 부드럽게 넘어가기 위해 전체 화면 페이드아웃 설정
                    // (화면 전체를 투명하게 만들면 바탕이 비쳐 깜빡이므로, 페이지 전환 효과로 부드럽게 넘어간다)

                    // 0.4초 뒤에 로그인 페이지(login.html)로 이동
                    setTimeout(() => {
                        sessionStorage.removeItem('brickSyncLastPage');
                        window.top.location.href = "login.html";
                    }, 400);
                }

                // 얇은 막대 너비 반영
                loadingBar.style.width = progress + "%";
            }, 100);
        }
    </script>
</body>

</html>
