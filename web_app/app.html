    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">        function addSystemLog(category, message) {
            const targets = [];
            try {
                const l1 = document.getElementById('liveConsoleLogList');
                if (l1) targets.push(l1);
            } catch(e) {}
            try {
                if (window.parent && window.parent.document) {
                    const l2 = window.parent.document.getElementById('liveConsoleLogList');
                    if (l2 && !targets.includes(l2)) targets.push(l2);
                }
            } catch(e) {}
            try {
                const iframe = document.querySelector('iframe');
                if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
                    const l3 = iframe.contentWindow.document.getElementById('liveConsoleLogList');
                    if (l3 && !targets.includes(l3)) targets.push(l3);
                }
            } catch(e) {}

            if (targets.length === 0) return;

            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
            
            let color = '#38bdf8';
            let icon = 'ℹ️';
            if (category === 'AI') { color = '#a855f7'; icon = '🗣️'; }
            else if (category === 'TRIGGER') { color = '#facc15'; icon = '🚀'; }
            else if (category === 'HUB') { color = '#3b82f6'; icon = '⚡'; }
            else if (category === 'FORTNITE') { color = '#10b981'; icon = '🎮'; }
            else if (category === 'MISSION') { color = '#ec4899'; icon = '🎉'; }

            targets.forEach(list => {
                const entry = document.createElement('div');
                entry.style.cssText = `border-left: 3px solid ${color}; padding-left: 8px; word-break: break-all; margin-bottom: 4px;`;
                entry.innerHTML = `<span style="color: #64748b;">[${timeStr}]</span> <strong style="color: ${color};">${icon} [${category}]</strong> ${message}`;
                list.appendChild(entry);
                list.scrollTop = list.scrollHeight;
            });
        }
window.addSystemLog = addSystemLog;
</script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 학생 세션 체크: Firebase Auth 우선, localStorage 레거시 폴백
        (function () {
            function checkLegacySession() {
                try {
                    const sessionDataStr = localStorage.getItem('bricksync_student_session');
                    if (!sessionDataStr) return false;
                    const sessionData = JSON.parse(sessionDataStr);
                    if (Date.now() >= sessionData.expires) {
                        localStorage.removeItem('bricksync_student_session');
                        return false;
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            // Firebase Auth 상태 확인 (비동기)
            if (typeof firebaseAuth !== 'undefined' && firebaseAuth) {
                // Firebase Auth 초기화 시간 및 레거시 세션 없으면 리다이렉트
                let authResolved = false;
                const authTimeout = setTimeout(() => {
                    if (!authResolved) {
                        if (!checkLegacySession()) {
                            window.location.href = 'login.html';
                        }
                    }
                }, 3000);

                firebaseAuth.onAuthStateChanged((user) => {
                    authResolved = true;
                    clearTimeout(authTimeout);
                    if (!user && !checkLegacySession()) {
                        window.location.href = 'login.html';
                    }
                });
            } else {
                if (!checkLegacySession()) {
                    window.location.href = 'login.html';
                    return;
                }
            }

            // LocalStorage 이벤트 감지 (타 탭 로그아웃)
            window.addEventListener('storage', (e) => {
                if (e.key === 'bricksync_student_session' && !e.newValue) {
                    if (typeof firebaseAuth === 'undefined' || !firebaseAuth?.currentUser) {
                        // 지웠다가 곧바로 다시 쓰는 경우(게스트 입장 등)는 로그아웃이 아니다 → 잠깐 기다렸다가 확인
                        setTimeout(() => {
                            if (!localStorage.getItem('bricksync_student_session')) window.location.href = 'login.html';
                        }, 600);
                    }
                }
            });

            // BroadcastChannel 수신 감지
            try {
                const monitorChannel = new BroadcastChannel('bricksync_monitor');
                monitorChannel.onmessage = function (event) {
                    if (event.data && event.data.type === 'RESET_ALL') {
                        localStorage.removeItem('bricksync_student_session');
                        window.location.href = 'login.html';
                    }
                };
            } catch (e) { }

            // Firebase Realtime DB 리셋 신호 감지
            if (typeof isFirebaseOnline !== 'undefined' && isFirebaseOnline && database) {
                try {
                    database.ref('bricksync_classroom/reset_signal').on('value', (snapshot) => {
                        const resetTime = snapshot.val();
                        if (resetTime) {
                            const sessionDataStr = localStorage.getItem('bricksync_student_session');
                            if (sessionDataStr) {
                                const session = JSON.parse(sessionDataStr);
                                const loginTime = session.loginTime || 0;
                                if (resetTime > loginTime) {
                                    localStorage.removeItem('bricksync_student_session');
                                    window.location.href = 'login.html';
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.error("Firebase reset monitor setup failed:", e);
                }
            }
        })();
    </script>

    <!-- 모든 페이지는 이 iframe 안에서 전환되며, 블루투스는 부모 창인 여기서 영구 유지됩니다. -->

    <!-- ═══════════════════════════════════════════════════════════
         Electron 전용 Bluetooth 장치 선택 UI (Chrome picker 대체)
         main.js에서 IPC로 bluetooth-devices 이벤트 수신 시 표시

    <div id="bt-picker-backdrop" style="
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 99998;
    "></div>

    <div id="bt-picker" style="
        display: none;
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.28);

        <!-- 헤더 -->
        <div style="padding: 20px 24px 12px; border-bottom: 1px solid #e8eaed;">

        <!-- 장치 목록 -->

    <style>
        @keyframes bt-spin {
            to { transform: rotate(360deg); }
        }
        .bt-device-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 24px; cursor: pointer;
            font-size: 14px; color: #202124;
            transition: background 0.15s;
        }
        .bt-device-item:hover { background: #f1f3f4; }
        .bt-device-item.selected { background: #e8f0fe; color: #1a73e8; }
        .bt-device-icon { font-size: 18px; flex-shrink: 0; }
    </style>

    <script>
        // ── Bluetooth Picker UI 로직 ──
        (function () {
            const picker     = document.getElementById('bt-picker');
            const backdrop   = document.getElementById('bt-picker-backdrop');
            const deviceList = document.getElementById('bt-device-list');
            const scanning   = document.getElementById('bt-scanning');
            const connectBtn = document.getElementById('bt-connect-btn');
            const cancelBtn  = document.getElementById('bt-cancel-btn');
            let selectedDeviceId = null;

            function showPicker() {
                picker.style.display = 'block';
                backdrop.style.display = 'block';
                // 스캔 중 초기화
                scanning.style.display = 'flex';
                // 기존 장치 항목 제거 (스캔 div 제외)
                Array.from(deviceList.querySelectorAll('.bt-device-item')).forEach(el => el.remove());
                selectedDeviceId = null;
                connectBtn.style.opacity = '0.4';
                connectBtn.style.pointerEvents = 'none';
            }

            function hidePicker() {
                picker.style.display = 'none';
                backdrop.style.display = 'none';
            }

            function selectDevice(id) {
                selectedDeviceId = id;
                connectBtn.style.opacity = '1';
                connectBtn.style.pointerEvents = 'auto';
            }

            // Electron IPC: main에서 장치 목록 수신
            if (window.electronAPI) {
                window.electronAPI.onBluetoothDevices(function (devices) {
                    showPicker();

                    if (!devices || devices.length === 0) {
                        // 아직 스캔 중
                        scanning.style.display = 'flex';
                        return;
                    }

                    // 스캔 완료 → 장치 목록 표시
                    scanning.style.display = 'none';

                    // 기존 항목 제거
                    Array.from(deviceList.querySelectorAll('.bt-device-item')).forEach(el => el.remove());

                    devices.forEach(function (device) {
                        const item = document.createElement('div');
                        item.className = 'bt-device-item';
                        item.dataset.deviceId = device.id;

                        const icon = document.createElement('span');
                        icon.className = 'bt-device-icon';
                        icon.textContent = device.isLego ? '🎮' : '📶';

                        const name = document.createElement('span');
                        name.textContent = device.name;

                        item.appendChild(icon);
                        item.appendChild(name);

                        item.addEventListener('click', function () {
                            Array.from(deviceList.querySelectorAll('.bt-device-item'))
                                .forEach(function (el) { el.classList.remove('selected'); });
                            item.classList.add('selected');
                            selectDevice(device.id);
                        });

                        deviceList.appendChild(item);

                        // LEGO Hub가 하나뿐이면 자동 선택
                        if (device.isLego && devices.filter(function(d){ return d.isLego; }).length === 1) {
                            item.classList.add('selected');
                            selectDevice(device.id);
                        }
                    });
                });
            }

            // 연결 버튼
            connectBtn.addEventListener('click', function () {
                if (selectedDeviceId && window.electronAPI) {
                    // 연결 중 UI 표시 (흰 화면 대신 로딩 표시)
                    connectBtn.textContent = '연결 중...';
                    connectBtn.style.opacity = '0.7';
                    connectBtn.style.pointerEvents = 'none';
                    cancelBtn.style.pointerEvents = 'none';

                    window.electronAPI.selectBluetoothDevice(selectedDeviceId);

                    // GATT 연결 완료 or 실패 시 picker 닫기 (connectionType 변화 감지)
                    const checkInterval = setInterval(function () {
                        if (window.connectionType === 'BLE') {
                            clearInterval(checkInterval);
                            hidePicker();
                        }
                    }, 300);

                    // 15초 타임아웃 후 자동 닫기 (GATT 10초 타임아웃보다 길어야 에러 알림 표시됨)
                    setTimeout(function () {
                        clearInterval(checkInterval);
                        hidePicker();
                    }, 15000);
                }
            });


            // 취소 버튼
            cancelBtn.addEventListener('click', function () {
                if (window.electronAPI) {
                    window.electronAPI.selectBluetoothDevice('');
                }
                hidePicker();
            });

            // 배경 클릭 취소
            backdrop.addEventListener('click', function () {
                if (window.electronAPI) {
                    window.electronAPI.selectBluetoothDevice('');
                }
                hidePicker();
            });
        })();
    </script>

    <script>
        // SPA 내부 페이지 상태 유지 (새로고침 시 마지막 화면 복원)
        (function () {
            // 마지막 화면 기록이 없는 새 탭이어도, 여기까지 왔다면 로그인 정보가 유효하다는 뜻이므로 메인 메뉴로 보낸다
            let lastPage = sessionStorage.getItem('brickSyncLastPage') || 'index.html';
            // 쿼리 파라미터가 이미 있는지 확인하여 캐시 무력화 구문 추가

        // [신규] iframe 내부 페이지 안전 이동 함수 (크롬 정책 보호)
        window.navigateIframe = function(url) {

            try {
                const sep = url.includes('?') ? '&' : '?';
                const iframe = document.getElementById('main-frame');
                console.log("▶ [PARENT_NAV] iframe element found:", iframe);
                if (iframe) {
                    const targetSrc = url + sep + 'v=' + new Date().getTime();

                    iframe.src = targetSrc;
                } else {
                    console.error("▶ [PARENT_NAV] Error: iframe element not found!");
                }
            } catch (e) {
                console.error("▶ [PARENT_NAV] Iframe navigation failed:", e);
            }
        };
    </script>

    <script>
        // === [글로벌 SPA 상태 및 코어 통신 엔진] ===
        window.connectionType = null;
                window.isBluetoothMode = false;
        window.rxCharacteristic = null;
        window.txCharacteristic = null;
        window.port = null;
        window.writer = null;
        window.activeStates = { LEFT: false, RIGHT: false, UP: false, DOWN: false };
                window.getHubTiltState = function () {
            if (window.lastStableXState === 'TILT_LEFT') return 'left';
            if (window.lastStableXState === 'TILT_RIGHT') return 'right';
            if (window.lastStableYState === 'TILT_UP') return 'up';
            if (window.lastStableYState === 'TILT_DOWN') return 'down';
            return 'flat';
        };
        window.initialX = null;
        window.initialY = null;
        window.candidateXState = "CENTER_X";
        window.candidateYState = "CENTER_Y";
        window.consecutiveXFrames = 0;
        window.consecutiveYFrames = 0;
        window.lastStableXState = "CENTER_X";
        window.lastStableYState = "CENTER_Y";

        let ws;

        // 서버(터미널)에 찍힌 내용을 지금 열려 있는 학습 화면의 "통신 로그"에도 똑같이 보여 준다
        function addServerLog(text) {
            try {
                const frame = document.getElementById('main-frame');
                const doc = frame && frame.contentWindow && frame.contentWindow.document;
                const list = doc && doc.getElementById('liveConsoleLogList');
                if (!list) return;
                const now = new Date();
                const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
                const safe = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;');
                const entry = doc.createElement('div');
                entry.style.cssText = 'border-left: 3px solid #94a3b8; padding-left: 8px; word-break: break-all; margin-bottom: 4px;';
                entry.innerHTML = '<span style="color: #64748b;">[' + timeStr + ']</span> <strong style="color: #94a3b8;">🖥️ [SERVER]</strong> ' + safe;
                list.appendChild(entry);
                while (list.children.length > 400) list.removeChild(list.firstChild);
                list.scrollTop = list.scrollHeight;
            } catch (e) { }
        }

        // --- 1. 파이썬 로컬 서버 통신 (자동 재연결 적용) ---
        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;      // 이미 연결 중이면 또 만들지 않는다
            let wsUrl = "ws://127.0.0.1:8000/ws";
            // 로컬 환경(localhost/127.0.0.1)에서 직접 접속한 경우 현재 호스트 사용
            if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                let protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
                wsUrl = protocol + window.location.host + "/ws";
            }
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                console.log("✔️ 백그라운드 키보드 서버 접속 성공!");
                updateWsUI(true);
            };
            ws.onerror = () => { };
            ws.onmessage = (ev) => {
                try {
                    const d = JSON.parse(ev.data);
                    if (d && d.type === 'SERVER_LOG') addServerLog(d.msg);
                } catch (e) { }
            };
            ws.onclose = () => {
                updateWsUI(false);
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updateWsUI(isConnected) {
            try { window.dispatchEvent(new CustomEvent('bs-bridge-status', { detail: !!isConnected })); } catch (e) { }
            const iframe = document.getElementById("main-frame").contentWindow;
            if (iframe && iframe.document.getElementById('status')) {
                const statusEl = iframe.document.getElementById('status');
                if (isConnected) {
                    statusEl.innerHTML = "<b>🟢 로컬 서버(포트나이트 연동) 연결 완료</b>";
                    statusEl.style.color = "#10b981";
                } else {
                    statusEl.innerHTML = "<b>🔴 로컬 브릿지 서버(server.py) 연결 안 됨</b>";
                    statusEl.style.color = "#ef4444";
                }
            }
        }

        connectWebSocket();

        // 설정창의 "서버 연결" 구역이 쓰는 도우미: 지금 연결 상태 / 바로 다시 연결
        window.getBridgeStatus = function () { return !!(ws && ws.readyState === WebSocket.OPEN); };
        window.reconnectBridge = function () {
            try { if (ws && ws.readyState === WebSocket.OPEN) return true; } catch (e) { }
            connectWebSocket();
            return false;
        };

        // 실행이 시작되면(아이콘/워드 어느 화면이든 isBlockExecutionRunning 이 true 가 되면) 포트나이트 창을 미리 앞으로 가져온다.
        // 첫 회전/조명 신호가 창 전환 중에 사라지는 것을 막기 위해, 실제 첫 신호보다 먼저 전환해 둔다.
        (function () {
            let running = false, timer = null;
            Object.defineProperty(window, 'isBlockExecutionRunning', {
                configurable: true, enumerable: true,
                get() { return running; },
                set(v) {
                    running = v;
                    if (v) {
                        clearTimeout(timer);
                        timer = setTimeout(() => { try { sendCommand('FOCUS_FORTNITE'); } catch (e) { } }, 600);
                    }
                }
            });
        })();

        // iframe 내에서 웹소켓에 직접 접근할 수 있도록 노출
        window.sendWebSocketAction = function (actionObj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(actionObj));
            }
        };

        function sendCommand(actionName) {
            if (ws && ws.readyState === WebSocket.OPEN) {

        // --- 2. Web Bluetooth 및 USB 통신 영역 ---
        window.writeToHub = async function (data) {
            let buffer = (typeof data === 'string') ? new TextEncoder().encode(data) : data;

            if (window.connectionType === 'USB') {
                if (!window.writer) window.writer = window.port.writable.getWriter();
                await window.writer.write(buffer);
                window.writer.releaseLock();
                window.writer = null;
            } else if (window.connectionType === 'BLE' || window.txCharacteristic) {
                bleWriteQueue = bleWriteQueue.catch(() => {}).then(async () => {
                    for (let i = 0; i < buffer.byteLength; i += 20) {
                        let chunk = buffer.slice(i, i + 20);
                        if (window.txCharacteristic) {
                            try {
                                await window.txCharacteristic.writeValueWithoutResponse(chunk);
                            } catch (e) {
                                try {
                                    await window.txCharacteristic.writeValue(chunk);
                                } catch(e2) {}
                            }
                            await new Promise(r => setTimeout(r, 20));
                        }
                    }
                }).catch(() => {});
                await bleWriteQueue;
            }
        };

                    BSHub.error('브라우저가 블루투스를 막고 있어요', [
                        '주소창 왼쪽 자물쇠(🔒)를 눌러요',
                        '"Bluetooth"를 "허용"으로 바꿔요',
                        '페이지를 새로고침(F5)해요',
                        '그래도 안 되면 주소창에 chrome://settings/content/bluetoothDevices (Edge는 edge://…)를 입력해 확인해요'
                    ]);
                } else {
                    BSHub.error('블루투스를 사용할 수 없어요', [
                        'Chrome 또는 Edge 브라우저를 사용해 주세요 (Firefox · Safari 미지원)',
                        'Windows Bluetooth가 켜져 있는지 확인해요',
                        '[설정 → Bluetooth 및 장치]에서 Bluetooth를 켜 주세요'
                    ]);
                }
                window.connectionType = null;
                window.isBluetoothMode = false;
                return false;
            }

            const LEGO_HUB_SERVICE_ID = '00001623-1212-efde-1623-785feabcd123';
            const OPTIONAL_SERVICE_ID  = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';

            // ── Electron 환경 감지 ──
            const isElectron = /electron/i.test(navigator.userAgent);

            const requestOptions = isElectron
                ? {
                    // Electron: 이름 접두사 필터
                    filters: [
                        { namePrefix: 'LEGO' },
                        { namePrefix: 'Hub' },
                        { namePrefix: 'SPIKE' },
                        { namePrefix: 'Technic' }
                    ],
                    optionalServices: [LEGO_HUB_SERVICE_ID, OPTIONAL_SERVICE_ID]
                  }
                : {
                    // 일반 브라우저: 서비스 UUID + 이름 접두사 동시 필터 (어느 쪽이든 매칭)
                    filters: [
                        { services: [LEGO_HUB_SERVICE_ID] },
                        { namePrefix: 'LEGO' },
                        { namePrefix: 'Hub' },
                        { namePrefix: 'SPIKE' },
                        { namePrefix: 'Technic' }
                    ],
                    optionalServices: [LEGO_HUB_SERVICE_ID, OPTIONAL_SERVICE_ID]
                  };

            try {
                // 허브 사진과 연결 방법을 보여 주고, '연결하기'를 눌러야 브라우저 목록(페어링 창)을 연다
                const cancelled = () => { const c = new Error('cancelled'); c.name = 'NotAllowedError'; return c; };
                if (!(await BSHub.guide())) throw cancelled();

                // ① 전에 연결해 본 허브(BS_EH / BS_PH 이름)는 브라우저 목록 없이 바로 연결한다
                let device = null, failedKnown = false;
                if (typeof navigator.bluetooth.getDevices === 'function') {
                    let known = [];
                    try { known = (await navigator.bluetooth.getDevices()).filter(d => /^BS_(EH|PH)\d+/i.test(d.name || '')); } catch (e) { known = []; }
                    let pick = null;
                    if (known.length >= 1) {
                        pick = await BSHub.choose(known);
                        if (pick === null) throw cancelled();
                        if (pick === 'new') pick = null;
                    }
                    if (pick) {
                        try {
                            BSHub.searching(pick.name);
                            await connectKnownHub(pick);
                            BSHub.success(pick.name); paintHubBlue();
                            return true;
                        } catch (e) { failedKnown = true; console.warn('저장된 허브 연결 실패', e); }
                    }
                }
                // ② 처음 연결하는 허브(또는 저장된 허브에 연결 실패): 브라우저 목록을 연다
                if (failedKnown) {
                    if (!(await BSHub.askPicker(T2('저장된 허브에 연결하지 못했어요. 허브 전원을 켜고 파랗게 깜빡이는지 확인한 뒤, 아래 버튼을 눌러 새로 찾아요.', 'Could not reach the saved hub. Make sure it blinks blue, then open the list.')))) throw cancelled();
                }
                if (typeof navigator.bluetooth.getDevices !== 'function') BSHub.searching(null, true);          // 이 브라우저는 허브를 기억하지 못한다
                device = await navigator.bluetooth.requestDevice(requestOptions);
                BSHub.searching(device.name);
                await connectBluetoothDevice(device);
                BSHub.success(device.name); paintHubBlue();
                return true;
            } catch (error) {
                const again = () => { try { window.connectBluetooth(); } catch (e) { } };
                if (error.name === 'NotFoundError') {
                    BSHub.error('허브를 찾지 못했어요', ['허브 전원이 켜져 있는지 확인해요', '허브의 연결 버튼을 한 번 눌러 파랗게 깜빡이게 해요', '허브가 다른 기기와 연결되어 있으면 먼저 끊어요'], again);
                } else if (error.name === 'NetworkError') {
                    BSHub.error('허브에 연결하지 못했어요', ['허브가 꺼져 있거나 다른 기기와 연결되어 있어요', '허브를 껐다 켜고 다시 해 봐요'], again);
                } else if (error.name === 'SecurityError') {
                    BSHub.error('블루투스 권한이 없어요', ['앱을 다시 시작하거나 선생님께 알려 주세요']);
                } else if (error.name !== 'NotAllowedError') {
                    BSHub.error('블루투스 오류가 났어요', ['오류 종류: ' + error.name, error.message || ''], again);
                    console.error('Bluetooth 오류:', error);
                } else {
                    BSHub.close();                  // 목록에서 취소한 경우: 조용히 닫는다
                }
                window.connectionType = null;
                window.isBluetoothMode = false;
                throw error;
            }
        };

        async function connectBluetoothDevice(device) {
            const LEGO_HUB_SERVICE_ID = '00001623-1212-efde-1623-785feabcd123';
            const LEGO_HUB_CHARACTERISTIC_ID = '00001624-1212-efde-1623-785feabcd123';
            const NORDIC_UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
            const NORDIC_UART_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
            const NORDIC_UART_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

            if (!device.hasDisconnectListener) {
                device.addEventListener('gattserverdisconnected', () => {
                    window.connectionType = null;
                window.isBluetoothMode = false;
                    updateUI('DISCONNECT');
                    setTimeout(() => startBackgroundReconnect(device), 3000);
                });
                device.hasDisconnectListener = true;
            }

            // [1단계] GATT 서버 연결 (10초 타임아웃)
            let server;
            try {
                server = await Promise.race([
                    device.gatt.connect(),
                    new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('GATT 연결 시간 초과 (10초)\n\n• Hub 전원이 켜져 있는지 확인하세요\n• Hub가 다른 기기와 연결되어 있으면 먼저 끊어주세요\n• Hub를 껐다가 다시 켜서 재시도하세요')), 10000)
                    )
                ]);
            } catch (e) {
                throw new Error(`GATT 서버 연결 실패: ${e.message}`);

            }

            await new Promise(r => setTimeout(r, 800));

            // [2단계] Primary Service 가져오기 (LEGO LWP 먼저, 없으면 Nordic UART 시도)
            let service;
            try {
                service = await server.getPrimaryService(LEGO_HUB_SERVICE_ID);
            } catch (e1) {
                try {
                    service = await server.getPrimaryService(NORDIC_UART_SERVICE);
                } catch (e2) {
                    throw new Error(`서비스 첣기 실패.\nLEGO 서비스: ${e1.message}\nNordic UART: ${e2.message}`);
                }
            }

            // [3단계] Characteristic 가져오기
            try {
                window.rxCharacteristic = await service.getCharacteristic(LEGO_HUB_CHARACTERISTIC_ID)
                    .catch(() => service.getCharacteristic(NORDIC_UART_RX));
                window.txCharacteristic = window.rxCharacteristic;
            } catch (e) {
                throw new Error(`Characteristic 첣기 실패: ${e.message}`);
            }

            window.connectionType = 'BLE';
                window.isBluetoothMode = true;
            updateUI('BLE');

            try {
                const monitorChannel = new BroadcastChannel('bricksync_monitor');
                let studentName = 'Guest_익명';
                const sessionDataStr = localStorage.getItem('bricksync_student_session');
                if (sessionDataStr) {
                    const sessionData = JSON.parse(sessionDataStr);
                    if (Date.now() < sessionData.expires) studentName = sessionData.name;
                }
                monitorChannel.postMessage({
                    type: 'SYSTEM',
                    msg: `레고 스파이크 허브 블루투스 연결 성공 🔵`,
                    student: studentName
                });
            } catch (e) { }

            // [4단계] Notification 시작
            try {
                await window.txCharacteristic.startNotifications();
                window.txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);
            } catch (e) {
                throw new Error(`Notification 시작 실패: ${e.message}`);
            }

            // [5단계] 모든 포트 센서 구독 (외부 포트 A~F)
            for (let p = 0; p < 6; p++) {
                const subscribeMsg = new Uint8Array([10, 0, 0x41, p, 0, 1, 0, 0, 0, 1]);
                try { await window.txCharacteristic.writeValueWithoutResponse(subscribeMsg); } catch (e) { }
                await new Promise(r => setTimeout(r, 30));
            }

            // [6단계] 내장 IMU 센서 구독 (포트 99 - 자이로/가속도)
            // LEGO SPIKE 내장 IMU는 LWP3 프로토콜로 명시적 구독이 필요
            const imuPorts = [97, 98, 99]; // 허브 펌웨어 버전에 따라 포트 다름
            for (const imuPort of imuPorts) {
                // mode 0: acceleration, mode 3: tilt angle
                for (const mode of [0, 3]) {
                    const imuMsg = new Uint8Array([10, 0, 0x41, imuPort, mode, 1, 0, 0, 0, 1]);
                    try { await window.txCharacteristic.writeValueWithoutResponse(imuMsg); } catch (e) { }
                    await new Promise(r => setTimeout(r, 30));
                }
            }
            console.log('[BLE] 내장 IMU 구독 완료 (port 97/98/99, mode 0/3)');
        }

        window.isReconnecting = false;
        // [BUG-01 FIX] 재귀 호출 제거: setTimeout + 최대 재시도 횟수(maxRetries) 제한으로 교체
        // 이전 코드는 catch 블록에서 startBackgroundReconnect()를 재귀 호출하여
        // 연결이 계속 실패할 경우 콜 스택이 무한히 쌓이는 스택 오버플로우 위험이 있었음.
        async function startBackgroundReconnect(device, retryCount = 0) {
            const MAX_RETRIES = 10; // 최대 재시도 10회 (약 20초)
            if (window.connectionType || window.isReconnecting) return;
            if (retryCount >= MAX_RETRIES) {
                console.warn(`[BLE] 백그라운드 재연결 포기: ${MAX_RETRIES}회 시도 후 실패`);
                return;
            }
            window.isReconnecting = true;
            try {
                await connectBluetoothDevice(device);
                console.log("SPA 백그라운드 자동 복원 성공!");
            } catch (e) {
                console.warn(`[BLE] 재연결 시도 ${retryCount + 1}/${MAX_RETRIES} 실패:`, e.message || e);
                // 재귀 대신 setTimeout으로 다음 시도 예약 (지수 백오프: 2s → 4s → 최대 8s)
                const delay = Math.min(2000 * Math.pow(1.5, retryCount), 8000);
                setTimeout(() => startBackgroundReconnect(device, retryCount + 1), delay);
            } finally {
                // finally 블록으로 플래그 해제를 보장하여 플래그가 영구 잠기는 문제 방지
                window.isReconnecting = false;
            }
        }

        // =================================================================================
        // 안티그라비티 전역 제스처 복원 기법 비활성화 (프로젝트 카드 클릭 먹통 버그 방지)
        // =================================================================================

        // iframe 내부에서 클릭이 일어날 때도 부모창이 알아채서 복구하도록 트리거 바인딩 (onload마다 갱신)

        function getCurrentUnit() {
            try {
                const iframe = document.getElementById('main-frame');
                if (iframe && iframe.contentWindow) {

function handleBLEData(event) {
            const value = event.target.value;
            if (value.byteLength < 3) return;
            const msgType = value.getUint8(2);

            if (msgType === 0x04 && value.byteLength >= 7) {
                const portID = value.getUint8(3);
                const eventType = value.getUint8(4);
                if (!window.hubDevices) window.hubDevices = {};

                if (eventType === 0x01) {
                    const ioType = value.getUint16(5, true);
                    window.hubDevices[portID] = ioType;
                    console.log(`[LWP3 Attached I/O] Port: ${portID} (0x${portID.toString(16).toUpperCase()}), IO Type: ${ioType} (${ioType === 64 ? '3x3 Light Matrix' : ioType === 23 ? 'RGB Light' : 'Device'})`);

                    if (ioType === 57 || ioType === 59 || ioType === 61 || ioType === 62 || ioType === 63) {
                        const subscribeMsg = new Uint8Array([10, 0, 0x41, portID, 0, 1, 0, 0, 0, 1]);
                        if (window.txCharacteristic) window.txCharacteristic.writeValueWithoutResponse(subscribeMsg).catch(e => { });
                    }
                } else if (eventType === 0x00) {
                    delete window.hubDevices[portID];
                }
            } else if (msgType === 0x05) {
                // ⚠️ Generic Error Message from Hub
                const cmdType = value.byteLength > 3 ? value.getUint8(3) : 0;
                const errCode = value.byteLength > 4 ? value.getUint8(4) : 0;
                const errNames = { 1:'ACK', 2:'MACK', 3:'BUFFER_OVERFLOW', 4:'TIMEOUT', 5:'COMMAND_NOT_RECOGNIZED', 6:'INVALID_USE', 7:'OVERCURRENT', 8:'INTERNAL_ERROR' };
                console.error(`[LWP3 Generic Error] MsgType: 0x05, Failed Cmd: 0x${cmdType.toString(16)}, Error: ${errNames[errCode] || errCode} (0x0${errCode})`);
            } else if (msgType === 0x82) {
                // ℹ️ Port Output Command Feedback
                const portID = value.byteLength > 3 ? value.getUint8(3) : 0;
                const feedback = value.byteLength > 4 ? value.getUint8(4) : 0;
                console.log(`[LWP3 Port Feedback] Port: ${portID}, Status: 0x${feedback.toString(16).padStart(2,'0')} (Bit0:InProgress=${(feedback&1)!==0}, Bit1:Completed=${(feedback&2)!==0}, Bit3:Idle=${(feedback&8)!==0}, Bit4:Busy=${(feedback&16)!==0})`);
                // 모터가 '각도만큼 돌리기'를 끝냈거나(0x02) 다른 명령으로 대체됐을 때(0x04) 시각을 남긴다 (아이콘 모드 회전 블록이 다음 블록으로 넘어갈 때 쓴다)
                try {
                    if (!window.hubMotorDone) window.hubMotorDone = {};
                    for (let fi = 3; fi + 1 < value.byteLength; fi += 2) {
                        if (value.getUint8(fi + 1) & 0x06) window.hubMotorDone[value.getUint8(fi)] = Date.now();
                    }
                } catch (e) { }
            } else if (msgType === 0x45) {
                const portID = value.getUint8(3);
                if (!window.sensorData) window.sensorData = {};

                // 허브 내장 자이로/가속도 센서 (Port 97: Accelerometer, Port 99: Orientation)
                if ((portID === 97 || portID === 99) && value.byteLength >= 8) {
                    const rawX = value.getInt16(4, true);
                    const rawY = value.getInt16(6, true);

                    console.log('[RAW ACCEL]', 'port:', portID, 'rawX:', rawX, 'rawY:', rawY);
                    // ✅ 아케이드 최적 데드존 임계치 (±15°~20° 의도적 조작 시에만 반응)
                    const thresholdX = 160;
                    const thresholdY = 160;

                    if (window.initialX == null || window.initialY == null) {
                        window.initialX = rawX;
                        window.initialY = rawY;
                        return;
                    }

                    const currentUnit = getCurrentUnit();
                    const adjX = rawX - window.initialX;
                    const adjY = rawY - window.initialY;

                    let x_state = "CENTER_X", y_state = "CENTER_Y";
                    if (adjY > thresholdY) y_state = "TILT_UP"; 
                    else if (adjY < -thresholdY) y_state = "TILT_DOWN";

                    if (adjX > thresholdX) x_state = "TILT_RIGHT"; 
                    else if (adjX < -thresholdX) x_state = "TILT_LEFT";

                    console.log("[TILT DEBUG]", "adjX:", adjX, "adjY:", adjY, "x_state:", x_state, "y_state:", y_state);

                    // 🎯 3대 필수 조건 검사:
                    // 1. 워크스페이스에 기울기 센서(event_tilt_sensor) 블록이 있는가?
                    // 2. 실행(Play) 버튼이 눌려 실행 중인가?
                    // 3. 포트나이트 탈것에 탑승(isVehicleBoarded) 중인가?
                    const hasTiltBlock = hasTiltSensorBlockOnWorkspace();
                    const isRunning = isBlockExecutionRunningActive();
                    const isBoarded = !!window.isVehicleBoarded;
                    const canDriveFortnite = hasTiltBlock && isRunning && isBoarded;

                    // X축 3프레임 스무딩 댐핑
                    if (window.candidateXState === x_state) {
                        window.consecutiveXFrames++;
                        if (window.consecutiveXFrames >= 3 && window.lastStableXState !== x_state) {
                            window.lastStableXState = x_state;
                            if (canDriveFortnite) {
                                updateState("LEFT", x_state === "TILT_LEFT", "STEER_LEFT", "STOP_LEFT");
                                updateState("RIGHT", x_state === "TILT_RIGHT", "STEER_RIGHT", "STOP_RIGHT");
                            } else {
                                if (window.activeStates["LEFT"]) updateState("LEFT", false, "STEER_LEFT", "STOP_LEFT");
                                if (window.activeStates["RIGHT"]) updateState("RIGHT", false, "STEER_RIGHT", "STOP_RIGHT");
                            }
                        }
                    } else {
                        window.candidateXState = x_state;
                        window.consecutiveXFrames = 1;
                    }

                    // Y축 3프레임 스무딩 댐핑
                    if (window.candidateYState === y_state) {
                        window.consecutiveYFrames++;
                        if (window.consecutiveYFrames >= 3 && window.lastStableYState !== y_state) {
                            window.lastStableYState = y_state;
                            if (canDriveFortnite) {
                                updateState("UP", y_state === "TILT_UP", "STEER_UP", "STOP_UP");
                                updateState("DOWN", y_state === "TILT_DOWN", "STEER_DOWN", "STOP_DOWN");
                            } else {
                                if (window.activeStates["UP"]) updateState("UP", false, "STEER_UP", "STOP_UP");
                                if (window.activeStates["DOWN"]) updateState("DOWN", false, "STEER_DOWN", "STOP_DOWN");
                            }
                        }
                    } else {
                        window.candidateYState = y_state;
                        window.consecutiveYFrames = 1;
                    }
                }
                // 프라임 힘 센서(63) / 거리 센서(62): 프라임 장비로는 아직 실측하지 못한 기본 구현이다
                else if (portID < 6 && (Number((window.hubDevices || {})[portID]) === 63 || Number((window.hubDevices || {})[portID]) === 62)) {
                    try {
                        const isForce = Number(window.hubDevices[portID]) === 63;
                        if (!window.forceValues) window.forceValues = {};
                        if (!window.distanceMm) window.distanceMm = {};
                        let raw = -1;
                        if (isForce) { raw = value.getUint8(4); window.forceValues[portID] = raw; window.sensorData[portID] = raw; }
                        else {
                            raw = value.byteLength >= 6 ? value.getUint16(4, true) : value.getUint8(4);
                            window.distanceMm[portID] = (raw > 0 && raw < 2000) ? raw : -1;      // 0, 2000 이상, 0xFFFF는 '물체 없음'으로 본다
                            window.latestDistanceValue = window.distanceMm[portID] < 0 ? 200 : window.distanceMm[portID] / 10;
                        }
                        // 처음 받은 값과 그 뒤 몇 초마다 원시 바이트를 통신 로그에 남긴다 (프라임이 있는 사람이 확인할 수 있도록)
                        const nowT = Date.now();
                        if (!window._fdLog) window._fdLog = {};
                        if (!window._fdLog[portID] || nowT - window._fdLog[portID] > 4000) {
                            window._fdLog[portID] = nowT;
                            const bytes = []; for (let i = 0; i < value.byteLength; i++) bytes.push(value.getUint8(i).toString(16).padStart(2, '0'));
                            if (typeof window.addSystemLog === 'function') window.addSystemLog('HUB', (isForce ? '🔘 힘 센서' : '📡 거리 센서') + '(포트 ' + 'ABCDEF'.charAt(portID) + ') 값 = ' + raw + (isForce ? '' : ' mm') + '   [원시 ' + bytes.join(' ') + ']');
                        }
                    } catch (e) { }
                }
                // 외부 센서: 컬러 센서(61) 등
                else if (portID < 6 && value.byteLength === 5) {
                    const colorVal = value.getInt8(4);
                    window.sensorData[portID] = colorVal; // 스파이크 내부의 색상 코드 번호 (0~10)
                    // 색 센서를 반사/주변 빛 모드로 읽는 동안에는 빛 값(0~100)을 따로 보관한다
                    try {
                        if (Number((window.hubDevices || {})[portID]) === 61 && window.colorSensorMode && Date.now() - (window.colorSensorModeAt || 0) > 200) {
                            if (window.colorSensorMode === 1) window.latestReflectValue = value.getUint8(4);
                            else if (window.colorSensorMode === 2) window.latestAmbientValue = value.getUint8(4);
                        }
                    } catch (e) { }
                }
            }
        }

        
        // 색 센서가 지금 보고 있는 색 번호 (허브가 알려 준 값). 센서가 없거나 값이 아직 없으면 undefined
        window.getColorSensorValue = function () {
            if (window.colorSensorMode) return undefined;           // 반사/주변 빛으로 읽는 중에는 색 번호가 아니다
            const dev = window.hubDevices || {}, sd = window.sensorData || {};
            for (let p = 0; p < 6; p++) {
                if (Number(dev[p]) === 61 && sd[p] !== undefined) return sd[p];
            }
            return undefined;
        };

        // 프라임 힘 센서가 지금 보고 있는 값: { value, pressed }. 센서가 없거나 값이 아직 없으면 undefined
        window.getForceState = function () {
            const dev = window.hubDevices || {}, fv = window.forceValues || {};
            for (let p = 0; p < 6; p++) {
                if (Number(dev[p]) === 63 && fv[p] !== undefined) return { value: fv[p], pressed: fv[p] > 0 };
            }
            return undefined;
        };
        // 프라임 거리 센서가 지금 보고 있는 거리(mm). 물체가 없으면 -1, 센서가 없거나 값이 아직 없으면 undefined
        window.getDistanceMm = function () {
            const dev = window.hubDevices || {}, dm = window.distanceMm || {};
            for (let p = 0; p < 6; p++) {
                if (Number(dev[p]) === 62 && dm[p] !== undefined) return dm[p];
            }
            return undefined;
        };
        // 허브 기울기: 'left' | 'right' | 'up' | 'down' | 'flat'. 지금 자세를 기준(평평)으로 다시 잡는다
        window.resetTiltBaseline = function () {
            window.initialX = null; window.initialY = null;
            window.lastStableXState = null; window.lastStableYState = null;
            window.candidateXState = null; window.candidateYState = null;
            window.consecutiveXFrames = 0; window.consecutiveYFrames = 0;
        };
        window.getTiltName = function () {
            const x = window.lastStableXState, y = window.lastStableYState;
            if (x === 'TILT_LEFT') return 'left';
            if (x === 'TILT_RIGHT') return 'right';
            if (y === 'TILT_UP') return 'up';
            if (y === 'TILT_DOWN') return 'down';
            return 'flat';
        };

        // 색 센서 모드 바꾸기 (0: 색 번호, 1: 반사 빛, 2: 주변 빛) — 아이콘 모드의 빛 센서 블록이 쓴다
        window.colorSensorMode = 0;
        window.setColorSensorMode = function (mode) {
            window.colorSensorMode = mode; window.colorSensorModeAt = Date.now();
            if (mode === 1) window.latestReflectValue = undefined; else if (mode === 2) window.latestAmbientValue = undefined;
            const dev = window.hubDevices || {};
            Object.keys(dev).forEach(k => {
                if (Number(dev[k]) === 61 && typeof window.writeToHub === 'function') {
                    window.writeToHub(new Uint8Array([10, 0, 0x41, Number(k), mode, 1, 0, 0, 0, 1])).catch(() => { });
                }
            });
        };

        // 🚗 포트나이트 탈것(자동차/보트/잠수함) 탑승 상태 관리 (기본: 하차 상태)
        window.isVehicleBoarded = false;
        function hasTiltSensorBlockOnWorkspace() {
            try {
                const iframe = document.getElementById('main-frame');
                const doc = iframe ? (iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document)) : document;
                if (doc) {
                    const tiltBlocks = doc.querySelectorAll('#workspaceArea [data-action="event_tilt_sensor"]');
                    return tiltBlocks.length > 0;
                }
            } catch (e) {}
            return false;
        }

        function isBlockExecutionRunningActive() {
            try {
                const iframe = document.getElementById('main-frame');
                const win = iframe ? iframe.contentWindow : window;
                if (win && win.isBlockExecutionRunning) return true;
                if (window.isBlockExecutionRunning) return true;
            } catch (e) {}
            return false;
        }


        window.toggleVehicleMount = function(forcedState) {
            window.isVehicleBoarded = (forcedState !== undefined) ? !!forcedState : !window.isVehicleBoarded;
            console.log(`🎮 [포트나이트] 탈것 탑승 상태 변경: ${window.isVehicleBoarded ? '🟢 탑승 중 (자이로 ON)' : '🔴 하차 상태 (자이로 OFF)'}`);

            // 하차 시 즉시 모든 가상 키 강제 해제
            if (!window.isVehicleBoarded) {
                if (window.activeStates) {
                    for (let d of ["UP", "DOWN", "LEFT", "RIGHT"]) {
                        if (window.activeStates[d]) {
                            updateState(d, false, "STEER_" + d, "STOP_" + d);
                        }
                    }
                }
                try { window.sendWebSocketAction({ action: "CLEANUP_KEYS" }); } catch(e) {}
            }

            // iframe UI 동기화
            try {
                const iframe = document.getElementById('main-frame');
                if (iframe && iframe.contentWindow && typeof iframe.contentWindow.updateVehicleMountUI === 'function') {
                    iframe.contentWindow.updateVehicleMountUI(window.isVehicleBoarded);
                }
            } catch(e) {}

            if (typeof addSystemLog === 'function') {
                addSystemLog('FORTNITE', window.isVehicleBoarded ? '🚗 탈것 탑승 감지: 자이로 조종 활성화' : '🚶 탈것 하차 감지: 자이로 조종 차단');
            }
        };

        // E 키 전역 감지 (상호작용 키 토글)
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'e' || e.key === 'E') && !e.target.matches('input, textarea, select')) {
                // E키를 눌러 탑승/하차 토글
                window.toggleVehicleMount();
            }
        });
        
        function updateState(direction, isPressed, activateCmd, deactivateCmd) {
            // 🛑 하차 상태일 때는 STEER_ 명령 활성화 방지
            if (activateCmd && activateCmd.startsWith('STEER_') && !window.isVehicleBoarded) {
                isPressed = false;
            }
            if (isPressed && !window.activeStates[direction]) {
                sendCommand(activateCmd);
                window.activeStates[direction] = true;
                logToIframe("🎮 " + activateCmd);
            } else if (!isPressed && window.activeStates[direction]) {
                sendCommand(deactivateCmd);
                window.activeStates[direction] = false;
                logToIframe("🛑 " + deactivateCmd);
            }
        }

        function logToIframe(msg) {
            const iframe = document.getElementById("main-frame").contentWindow;
            if (iframe && iframe.addLog) {
                iframe.addLog(msg);
            }
        }

        async function readLoopUSB() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = window.port.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();
            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) { reader.releaseLock(); break; }
                    if (value) {
                        buffer += value;
                        let lines = buffer.split('\n');
                        buffer = lines.pop();
                        processLines(lines);
                    }
                }
            } catch (error) { }
        }

        function processLines(lines) {
            for (let line of lines) {
                line = line.trim();
                if (line.length === 0) continue;
                logToIframe("RAW: " + line);
                if (line.includes("MSG_ITEM_GRANT")) {
                    console.log("🎁 허브 메시지 감지 -> 우클릭 발사!");
                    try { window.sendWebSocketAction({ action: "ITEM_GRANT_REWARD" }); } catch (e) { }
                }
                if (line.includes("Mission Complete!")) {
                    console.log("🏆 미션 완료 메시지 수신!");
                    const iframe = document.getElementById("main-frame").contentWindow;
                    if (iframe && typeof iframe.onUsbMissionComplete === 'function') {
                        iframe.onUsbMissionComplete();
                    }
                }
                if (line.includes("|")) {
                    const parts = line.split("|");
                    const x_state = parts[0] || "", y_state = parts[1] || "";
                    if (window.isVehicleBoarded) {
                        updateState("LEFT", x_state.includes("TILT_LEFT"), "STEER_LEFT", "STOP_LEFT");
                        updateState("RIGHT", x_state.includes("TILT_RIGHT"), "STEER_RIGHT", "STOP_RIGHT");
                        updateState("UP", y_state.includes("TILT_UP"), "STEER_UP", "STOP_UP");
                        updateState("DOWN", y_state.includes("TILT_DOWN"), "STEER_DOWN", "STOP_DOWN");
                    }
                }
            }
        }
    
        // --- 부모 창에서 아이프레임을 일정한 가로세로 비율로 벡터 축소하는 엔진 --- //
        function adjustIframeScale() {
            const iframe = document.getElementById('main-frame');
            if (!iframe) return;

            // 기준: 15.6인치 노트북에서 크롬 67%로 볼 때의 모습 (화면 폭 2290px 기준, bs_scale.js). 폰·태블릿(1000px 미만)은 예전 기준 1500px
            const currentWidth = window.innerWidth;
            let scale = (window.bsUiScale && window.bsUiScale()) || 1;
            if (scale === 1 && currentWidth < 1000) scale = Math.max(0.4, currentWidth / 1500);
            document.documentElement.style.setProperty('--bs-ui-z', String(scale));

            if (scale < 1) {
                
                // 가상 해상도를 확보하기 위해 아이프레임을 확대하여 렌더링 공간 제공
                iframe.style.width = (100 / scale) + '%';
                iframe.style.height = (100 / scale) + '%';
                // 전체 가상 공간을 현재 화면 크기에 맞추어 매끄럽게 축소
                iframe.style.transform = 'scale(' + scale + ')';
                iframe.style.transformOrigin = 'top left';
            } else {
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.transform = 'none';
                iframe.style.transformOrigin = 'top left';
            }
        }

        window.addEventListener('resize', adjustIframeScale);
        window.addEventListener('DOMContentLoaded', adjustIframeScale);
        
        // 아이프레임이 새로 로드될 때도 항상 축소 상태 동기화 및 가상 입력 키 릴리즈
        const mainIframe = document.getElementById('main-frame');
        if (mainIframe) {
            mainIframe.addEventListener('load', () => {
                adjustIframeScale();
                try { window.sendWebSocketAction({ action: "CLEANUP_KEYS" }); } catch (e) {}
            });
        }
</script>
</body>
